<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>每日打卡清单</title>
  <!-- 不发版缓存：改完样式刷新就能看到最新版，不用每次手动清手机缓存 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    :root {
      /* ---------- 极简浅色：白底 + 单一强调色 ----------
         主题（Day 14·C）：白底 + 单一强调色。羊皮纸、警示斜纹、砖缝、看板娘立绘、
         页头的主题标签与徽章一并下线 —— 不再走原来那套动漫主题路线。
         颜色只做两件事：中性灰管层级，一支蓝管「可交互 / 已选中 / 已完成」。
         唯一例外是逾期用的红 —— 那是语义色（危险），不是装饰色。 */
      --card: #ffffff;
      --page: #f5f6f8;
      --ink: #1f2328;          /* 正文 14.7:1 */
      --muted: #5f6874;        /* 次要文字 5.65:1 */
      --soft: #6b7280;         /* 更弱的说明文字 4.83:1（仍过 AA，别再调浅） */
      --soft-deep: #4b5563;    /* 触屏下删除键的墨色 */
      --line: #e8eaee;         /* 分隔线（装饰，不受 3:1 约束） */
      --row-line: #f2f3f6;
      --line-strong: #8a929e;  /* 控件边界 3.14:1，达 WCAG 1.4.11 */
      --surface-sunk: #f7f8fa; /* 内凹面：输入框、勾选框 */

      --accent: #2f6feb;       /* 4.57:1，白字压在上面也是 4.57:1 */
      --accent-deep: #1c4fc0;  /* 选中/hover 态：7.17:1，铁律是比常态更深 */
      --accent-wash: rgba(47, 111, 235, 0.08);
      --accent-wash-2: rgba(47, 111, 235, 0.14);
      --on-accent: #ffffff;
      --danger: #c93f35;       /* 4.89:1，只给逾期 */
      --danger-wash: rgba(201, 63, 53, 0.07);
      /* 深底撤销条上的字。用主题蓝的亮色版 —— 主题蓝 #2f6feb 压在深墨底上只有 3.46:1 不合格，
         #9ec1ff 是同色系的亮蓝，8.67:1。旧主题这里用的是亮金，换主题时漏改了 */
      --on-dark: #9ec1ff;

      /* ---------- 字体（零外部请求：PRD C2 禁止外链，只能用系统自带） ---------- */
      --font-display: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-body: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;

      /* ---------- 间距梯度（4 / 8 / 12 / 16 / 24 / 40） ---------- */
      --space-1: 4px; --space-2: 8px; --space-3: 12px;
      --space-4: 16px; --space-5: 24px; --space-6: 40px;

      /* ---------- 圆角 ---------- */
      --radius-sm: 8px; --radius-md: 14px; --radius-pill: 999px;

      /* ---------- 阴影三级 ---------- */
      --shadow-1: 0 1px 2px rgba(16, 24, 40, 0.06);
      --shadow-2: 0 6px 16px rgba(16, 24, 40, 0.10);
      --shadow-3: 0 2px 10px rgba(16, 24, 40, 0.06);

      /* ---------- 动效 ---------- */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-fast: 160ms; --dur-base: 300ms; --dur-slow: 640ms;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: 20px 16px 32px;
      /* 底部再叠一层安全区：手势条 / 小黑条会压住页脚。
         单独写一条而不是并进上面的简写 —— 万一浏览器不认 env()，
         只有这一条失效，32px 兜底还在。 */
      padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      /* 中文正文行高规范值 ≥1.7，这里是紧凑清单工具，取 1.6 折衷：
         再高会把列表撑长，违反「打开到勾完 ≤10 秒」的 A1 判据 */
      line-height: 1.6;
      background: var(--page);
    }
    .app {
      position: relative;
      max-width: 520px;
      margin: 0 auto;
      padding: 18px var(--space-4) 12px;
      border-radius: var(--radius-md);
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-3);
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .date {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.2;
      font-variant-numeric: lining-nums tabular-nums;
    }
    .week {
      display: block;
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-top: 2px;
    }
    /* 完成度 —— 「3/5」是打卡产品的情绪核心，必须是全页最大的字（服务 PRD 的 A1 十秒判据） */
    .progress {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      color: var(--ink);
      font-variant-numeric: lining-nums tabular-nums;
    }
    .progress .pg { display: flex; align-items: baseline; gap: 5px; }
    .pg-num {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .pg-tot { font-size: 15px; font-weight: 600; color: var(--muted); }
    .pg-label {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: var(--soft);
    }
    /* 全部完成 = 唯一值得用强调色的时刻（锐利色的用法是「少而准」，不是到处撒） */
    .progress.is-done .pg-num,
    .progress.is-done .pg-tot { color: var(--accent); }
    .pg-track {
      width: 84px;
      height: 4px;
      border-radius: 2px;
      background: var(--row-line);
      overflow: hidden;
    }
    .pg-track i {
      display: block;
      height: 100%;
      width: var(--pct, 0%);
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.35s ease;
    }
    @media (prefers-reduced-motion: reduce) { .pg-track i { transition: none; } }

    /* ---------- 视图切换：标签 + 原生横向滚动 ---------- */
    /* Day 13 的标签栏保留（点也能切）；Day 14 补一层手指滑动：
       容器是浏览器原生横向滚动 + scroll-snap，惯性、回弹、跟手全部由系统负责，
       JS 只在「停下来之后」把地址栏和标签同步过去 —— 这是滑动不掉帧的根本原因。 */
    .tabs {
      position: relative;
      display: flex;
      gap: 0;                    /* 三格必须紧密平铺，指示条才能用 translateX(100%) 对位 */
      margin: 14px 0 10px;
      padding: 3px;
      background: var(--surface-sunk);
      border-radius: var(--radius-pill);
    }
    /* 选中指示条：位置由 JS 按滚动比例实时写 transform，手指动多少它动多少。
       ⚠️ 刻意不加 transition —— 加了就永远比手指慢一拍，这就是「上面的方块滑得慢」的根因。
       点标签时同样由平滑滚动的 scroll 事件带着走，所以两种切换方式都是同一条动画曲线。 */
    .tab-ind {
      position: absolute;
      left: 3px;
      top: 3px;
      bottom: 3px;
      width: calc((100% - 6px) / 3);
      border-radius: var(--radius-pill);
      background: var(--card);
      box-shadow: var(--shadow-1);
      pointer-events: none;      /* 不能挡住底下按钮的点击 */
      z-index: 0;
    }
    .tab {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: color var(--dur-fast) ease;
    }
    .tab:hover { color: var(--ink); }
    .tab.is-on { color: var(--accent-deep); font-weight: 600; }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .views {
      display: flex;
      gap: 4px;
      align-items: flex-start;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      will-change: scroll-position; /* 提前告知浏览器要滚，滚动走合成线程 */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .views::-webkit-scrollbar { display: none; }
    .view {
      flex: 0 0 100%;
      min-width: 100%;
      /* 每页左右留 12px 内边距 —— 方块不贴页面边缘；配合页间 4px 间隙，
         滑动时相邻页内容不会看着互相穿插 */
      padding: 0 12px;
      overflow: hidden;
      /* 提升为独立合成层：滑动时只合成不重绘，跟手更顺。
         不影响布局 —— .undo 是 fixed 且在 .app 之外，不受这个包含块影响 */
      transform: translateZ(0);
      scroll-snap-align: start;
      /* 不写 scroll-snap-stop: always —— 那会强制「一次滑动只准翻一页」，
         快甩一下也只能走一格，手感上就是「慢」。让它按惯性自然走，反正 mandatory 会吸附到整页 */
    }

    /* 区块之间：一条细线就够，不做砖缝 */
    .block + .block {
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }
    .block { padding: 4px 0 6px; }
    .block h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--soft);
    }
    /* 今日清单是主角：字号提级 + 强调色，跟「提醒」拉开视觉层级 */
    #todayBlock h2 { font-size: 13px; letter-spacing: 0.1em; color: var(--accent-deep); }
    .class-block h2 { color: var(--accent-deep); }

    /* Day 12：筛选条 —— Day 13 后只剩两个互斥条件（「已完成」归到独立视图） */
    .filter {
      display: flex;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }
    .filter-btn {
      flex: none;
      padding: 5px 14px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 11.5px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background var(--dur-fast) ease, color var(--dur-fast) ease;
    }
    .filter-btn:hover { background: var(--accent-wash); color: var(--accent-deep); }
    .filter-btn.is-on {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
    }
    .filter-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---------- 动效编排 ---------- */
    .head, .tabs {
      animation: rise var(--dur-base) var(--ease-out) both;
    }
    .head { animation-delay: 0ms; }
    .tabs { animation-delay: 90ms; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    /* 视图切换不再用入场动画：横滑时它会在相邻页上闪一下，反而显得卡 */

    /* ---------- 主屏蓝图：倒数日一行 + 今天的课 ---------- */
    .anniv {
      display: flex;
      align-items: baseline;
      gap: var(--space-2);
      margin: var(--space-2) 0 var(--space-3);
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-sunk);
      font-size: 12px;
      letter-spacing: 0.03em;
      color: var(--muted);
      cursor: pointer;
    }
    .anniv:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* 管理列表里的日期录入框：日期要显示「2026-10-22」，比分钟数宽一截 */
    .an-date { flex: 0 1 132px !important; min-width: 96px; }
    li.an-past .title { color: var(--soft); }
    .anniv-tag {
      flex: none;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--accent);
    }
    .anniv-text { min-width: 0; }
    /* 每年重复勾选：整块可点（44px 触控高），不是只有那个小方框能点 */
    .an-yearly {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 2px;
      font-size: 12px;
      letter-spacing: 0.02em;
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .an-yearly input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .an-yearly:hover { color: var(--ink); }
    .cs-time {
      flex: none;
      width: 42px;
      font-size: 12px;
      font-variant-numeric: lining-nums tabular-nums;
      color: var(--muted);
    }
    .cs-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .cs-title { font-size: 13px; }
    .cs-meta { font-size: 11px; color: var(--muted); letter-spacing: 0.03em; }
    .cs-tip {
      flex: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
    }
    /* 正在上的那节：左侧强调条 + 浅底，一眼扫到 */
    li.cs.is-now { background: var(--accent-wash); border-left-color: var(--accent); }
    li.cs.is-now .cs-time { color: var(--accent-deep); }
    /* 已上完的：用底色弱化，不降透明度（降透明度会掉对比度，Day 9 的老教训） */
    li.cs.is-past { background: var(--surface-sunk); }
    li.cs.is-past .cs-title { color: var(--muted); }
    /* 提醒区默认折叠 —— 它比主角还重，但不是每天都用。标题压浅，让位给今日清单 */
    .fold > summary {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      list-style: none;
    }
    .fold > summary::-webkit-details-marker { display: none; }
    .fold > summary::marker { content: ""; }
    .fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .fold > summary h2 { flex: 1; margin-bottom: 0; color: var(--muted); }
    .fold[open] > summary h2 { margin-bottom: 8px; }
    /* 折叠时也要看得出有几条待办提醒 */
    .fold-count {
      flex: none;
      min-width: 18px;
      padding: 1px 6px;
      border-radius: 9px;
      background: var(--accent-wash);
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-deep);
      text-align: center;
    }
    .fold-count[hidden] { display: none; }
    .fold > summary::after {
      content: "";
      flex: none;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--soft);
      border-bottom: 1.5px solid var(--soft);
      transform: rotate(-45deg);
      margin-top: -3px;
      transition: transform 0.2s ease;
    }
    .fold[open] > summary::after { transform: rotate(45deg); margin-top: 3px; }
    @media (prefers-reduced-motion: reduce) { .fold > summary::after { transition: none; } }

    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 6px 6px 6px 2px;
      margin: 0; /* 原来 -6px 会让整行贴死页面边缘，滑动时看着像溢出；去掉后行随内边距内缩 */
      border-bottom: 1px solid var(--row-line);
      border-left: 2px solid transparent;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    li:last-child { border-bottom: none; }
    li:hover { background: var(--surface-sunk); border-left-color: var(--accent); }
    /* 整行可点：手指落在行内任何位置都算「勾一下」，不必精准戳中 22px 的方框 */
    #todayList li { cursor: pointer; -webkit-tap-highlight-color: rgba(47, 111, 235, 0.10); }
    #todayList li:active { background: var(--accent-wash-2); }
    .dot {
      position: relative;
      flex: none;
      width: 22px;
      height: 22px;
      border: 2px solid var(--line-strong);   /* 3.14:1，方框看得见才知道往哪戳 */
      border-radius: 4px;
      background: var(--card);
      color: var(--ink);
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease, color 0.15s ease;
    }
    .dot:active { transform: scale(0.92); }
    .dot:hover { border-color: var(--accent); }
    .dot.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    .title {
      flex: 1;
      /* min-width:0 —— flex 项默认 min-width:auto，长标题不肯压缩，整行被顶出卡片 */
      min-width: 0;
      word-break: break-all;
      /* 超长英文串 / 网址：break-all 之外再兜一层，允许在任意处断行 */
      overflow-wrap: anywhere;
    }
    li.done .title { color: var(--soft); text-decoration: line-through; }
    .del {
      position: relative;
      flex: none;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: var(--radius-sm);
      background: none;
      color: var(--soft);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    li:hover .del, .del:focus-visible { opacity: 1; }
    .del:hover { color: var(--danger); background: var(--danger-wash); }
    /* 触屏没有 hover，删除键常驻显示；这时必须用更深的墨色，原来 opacity 0.5 只有 1.98:1 */
    @media (hover: none) { .del { opacity: 1; color: var(--soft-deep); } }

    .add { display: flex; gap: 8px; margin-top: 12px; }
    .add-input {
      flex: 1;
      min-width: 0;
      padding: 10px var(--space-3);
      background: var(--surface-sunk);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
    }
    .add-input::placeholder { color: var(--soft); }
    .add-input:focus { outline: none; border-color: var(--accent); background: var(--card); }
    .add-btn {
      flex: none;
      width: 44px;
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--on-accent);
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .add-btn:hover { background: var(--accent-deep); }

    /* 状态视图：错误 */
    .state-view { display: none; text-align: center; padding: 30px 12px 24px; }
    body.is-error .app > *:not(.state-view):not(.tabs) { display: none !important; }
    body.is-error .state-view { display: block; }
    .state-icon {
      width: 46px;
      height: 46px;
      margin: 0 auto 16px;
      border: 1.5px solid var(--danger);
      border-radius: 50%;
      color: var(--danger);
      font-size: 24px;
      font-weight: 700;
      line-height: 43px;
    }
    .state-title { font-size: 15px; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 8px; }
    .state-desc {
      font-size: 12.5px;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 18px;
    }

    /* 加载态：骨架屏 */
    .skeleton { display: none; }
    /* Day 13：加载 / 错误是「数据」的状态，不是「页面」的状态 ——
       所以切视图的标签栏保留：你知道自己在哪，也还能切走，只有视图区被替换掉 */
    body.is-loading .app > *:not(.skeleton):not(.tabs) { display: none !important; }
    body.is-loading .skeleton { display: block; padding: 4px 0 10px; }
    .sk {
      height: 13px;
      border-radius: var(--radius-sm);
      margin: 0 0 12px;
      background: linear-gradient(90deg, #eef0f4 25%, #f7f8fa 50%, #eef0f4 75%);
      background-size: 200% 100%;
      animation: sk-shimmer 1.3s ease-in-out infinite;
    }
    .sk-head { height: 22px; width: 46%; margin-bottom: 20px; }
    .sk:nth-child(2) { width: 92%; }
    .sk:nth-child(3) { width: 78%; }
    .sk:nth-child(4) { width: 85%; }
    .sk:nth-child(5) { width: 64%; }
    @keyframes sk-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

    /* 提醒区 */
    li.hi { background: var(--accent-wash); border-left-color: var(--accent); }
    li.hi .title { color: var(--accent-deep); font-weight: 600; }
    li.hi .rm-meta { color: var(--accent-deep); letter-spacing: 0.06em; }
    li.past .title { color: var(--danger); }
    li.past .rm-meta { color: var(--danger); }
    /* 弱化只用底色，不降透明度（叠在深色字上只剩 1.9:1，Day 9 的老教训） */
    li.past { opacity: 1; background: var(--surface-sunk); }
    .rm-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .rm-meta {
      font-size: 11px;
      line-height: 1.3;
      color: var(--muted);
      letter-spacing: 0.03em;
      overflow-wrap: anywhere;
    }
    .export-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .export-row .act:disabled { opacity: 0.45; cursor: not-allowed; }
    .export-row .act:disabled:hover { background: var(--surface-sunk); }
    .export-tip { flex: 1; min-width: 0; font-size: 11px; color: var(--soft); letter-spacing: 0.02em; }
    .rem-form { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .rem-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .rem-row .add-input { flex: 1; min-width: 0; }
    /* 允许收缩（0 1）：系统字体放大 / 窄屏时不再把这一行顶出卡片 */
    .lead-input { flex: 0 1 92px !important; min-width: 60px; }
    .lead-tip { flex: none; align-self: center; font-size: 11px; color: var(--soft); letter-spacing: 0.04em; }

    /* 逾期区 */
    li.od { border-left: 2px solid var(--danger); background: var(--danger-wash); }
    li.od:hover { background: rgba(201, 63, 53, 0.12); border-left-color: var(--danger); }
    .od-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .od-date { font-size: 11px; line-height: 1.3; color: var(--danger); letter-spacing: 0.03em; }
    .act {
      flex: none;
      padding: 5px 9px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface-sunk);
      color: var(--muted);
      font-family: inherit;
      font-size: 11.5px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .act:hover { background: var(--accent-wash); color: var(--accent-deep); border-color: var(--accent); }
    li.od .del { opacity: 0.5; }
    li.od:hover .del { opacity: 1; }
    .empty {
      padding: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--soft);
      letter-spacing: 0.06em;
      background: var(--surface-sunk);
      border: 1px dashed var(--line);
      border-radius: var(--radius-sm);
    }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 12px 2px 2px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--soft);
      letter-spacing: 0.04em;
    }
    .link {
      flex: none;
      border: none;
      background: none;
      color: var(--accent);
      font-size: 11.5px;
      letter-spacing: 0.06em;
      cursor: pointer;
      padding: 4px 2px;
    }
    .link:hover { color: var(--accent-deep); text-decoration: underline; }

    /* ---------- Day 9：触控目标与窄屏 ---------- */
    /* 视觉尺寸不变，用透明伪元素把可点区域撑到 44px（WCAG 2.5.5 / HIG 建议值） */
    .dot::after,
    .del::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
    }
    /* 触屏下把输入框和操作按钮抬到 44px 高，指头点得准 */
    @media (pointer: coarse) {
      .add-input, .add-btn, .act { min-height: 44px; }
      .act { padding: 8px var(--space-3); }
      .tab, .filter-btn { min-height: 44px; }
    }
    /* 窄屏：提醒表单第二行（时间 + 分钟 + 说明）挤不下时换行，避免横向溢出 */
    @media (max-width: 380px) {
      /* 改用 flex-basis：基础尺寸已由 flex 简写接管，写 width 不再生效 */
      .rem-row .lead-input { flex-basis: 76px !important; }
      .lead-tip { flex-basis: 100%; text-align: left; }
    }

    /* ---------- Day 11：删除后的撤销条（反馈层③「可以反悔」） ---------- */
    /* 深墨底 + 亮字，跟页面上任何一块都不一样：它是盖在界面之上的临时层，不能假装是内容 */
    .undo {
      position: fixed;
      left: 50%;
      bottom: 20px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 14px;
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 10px 10px 10px 16px;
      border-radius: var(--radius-sm);
      background: var(--ink);
      color: #ffffff;
      box-shadow: var(--shadow-2);
      font-size: 13px;
      letter-spacing: 0.03em;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    }
    .undo.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }
    .undo-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .undo-btn {
      flex: none;
      min-height: 36px;                 /* 浮层总高限制下的折衷；宽的那一维够手指落 */
      padding: 0 10px;
      border: none;
      border-radius: var(--radius-sm);
      background: none;
      color: var(--on-dark);
      font: inherit;
      font-size: 13px;
      letter-spacing: 0.1em;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(158, 193, 255, 0.2);
    }
    .undo-btn:hover { background: rgba(158, 193, 255, 0.14); }
    /* 全局焦点环是蓝的，压在深墨底上等于看不见，这里换成亮的那支 */
    .undo-btn:focus-visible { outline-color: var(--on-dark); }
    @media (prefers-reduced-motion: reduce) {
      .undo { transition: none; transform: translate(-50%, 0); }
    }

    /* ---------- Day 9：键盘焦点可见（WCAG 2.4.7） ---------- */
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible,
    .link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    /* 尊重系统「减少动态效果」：入场动画、装饰性过渡、平滑滚动一并关掉 */
    @media (prefers-reduced-motion: reduce) {
      button, input, select, a, .link, .dot, .del, .tab, .filter-btn { transition: none; }
      .head, .tabs { animation: none; }
      .views { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="head">
      <div class="brand">
        <div>
          <div class="date" id="today"></div>
          <span class="week" id="week"></span>
        </div>
      </div>
      <div class="progress" id="progress" role="group" aria-label="今日完成进度"></div>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="视图切换">
      <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
      <button class="tab is-on" type="button" data-v="today" role="tab" aria-selected="true">今日清单</button>
      <button class="tab" type="button" data-v="reminders" role="tab" aria-selected="false">提醒</button>
      <button class="tab" type="button" data-v="done" role="tab" aria-selected="false">已完成</button>
    </nav>

    <div class="skeleton" id="skeleton" aria-hidden="true">
      <div class="sk sk-head"></div>
      <div class="sk"></div>
      <div class="sk"></div>
      <div class="sk"></div>
      <div class="sk"></div>
    </div>
    <div class="state-view" id="errorView">
      <div class="state-icon" aria-hidden="true">!</div>
      <div class="state-title">数据没能读出来</div>
      <div class="state-desc" id="errorMsg"></div>
      <button class="act" id="retryBtn" type="button">重试</button>
    </div>

    <!-- Day 14：三视图装进一个浏览器原生横向滚动容器，手指左右滑即可切换。
         惯性、回弹、跟手全部交给系统，JS 只负责「停下来之后」同步地址栏和标签 -->
    <div class="views" id="views">
    <div class="view" id="viewToday">
      <!-- 倒数日 —— 取自滴答清单：只占一行，不占块。做成块就会抢主屏。
           没有纪念日数据时整条隐藏（占位数据只在 ?state=mock 下出现）
           整条可点：点了去提醒视图里的管理区，不在这里展开第二层 -->
      <div class="anniv" id="annivBar" role="button" tabindex="0"
           aria-label="倒数纪念日，点击去管理" hidden>
        <span class="anniv-tag">倒数</span>
        <span class="anniv-text" id="annivText"></span>
      </div>

      <!-- 今天的课 —— 取自超级课程表：不只列课，还告诉你正在上 / 还有多久。
           这一条比整张周历都管用，所以主屏只放今天，全貌留给 #/timetable -->
      <section class="block class-block" id="classBlock" hidden>
        <h2>今天的课</h2>
        <ul id="classList"></ul>
      </section>

      <section class="block" id="overdueBlock" hidden>
      <h2>逾期 <span id="overdueCount"></span></h2>
      <ul id="overdueList"></ul>
    </section>

    <section class="block" id="todayBlock">
      <h2>今日清单</h2>
      <div class="filter" id="filterBar" role="group" aria-label="筛选今日清单">
        <button class="filter-btn is-on" type="button" data-f="all" aria-pressed="true">全部</button>
        <button class="filter-btn" type="button" data-f="open" aria-pressed="false">未完成</button>
      </div>
      <ul id="todayList"></ul>
      <div class="empty" id="emptyHint" hidden>今天还没有事项，在下面加一条。</div>
      <div class="empty" id="filterEmpty" hidden>没有符合筛选条件的项。</div>
      <form class="add" id="addForm" autocomplete="off">
        <input class="add-input" id="addInput" type="text" placeholder="添加一项…" aria-label="添加事项">
        <button class="add-btn" type="submit" aria-label="添加">+</button>
      </form>
    </section>

    </div>

    <div class="view" id="viewReminders">
      <section class="block" id="remBlock">
        <h2>提醒<span class="fold-count" id="remCount" hidden></span></h2>
        <div class="fold-body">
        <ul id="remindList"></ul>
        <div class="empty" id="remEmpty" hidden>还没有提醒，在下面加一条。</div>
        <div class="export-row">
          <button class="act" id="exportBtn" type="button">导出日历 .ics</button>
          <span class="export-tip" id="exportTip"></span>
        </div>
        <form class="rem-form" id="remForm" autocomplete="off">
          <div class="rem-row">
            <input class="add-input" id="remTitle" type="text" placeholder="提醒标题…" aria-label="提醒标题">
            <button class="add-btn" type="submit" aria-label="添加提醒">+</button>
          </div>
          <div class="rem-row">
            <input class="add-input" id="remAt" type="datetime-local" aria-label="事件时间">
            <input class="add-input lead-input" id="remLead" type="number" min="0" step="5" value="0" aria-label="提前分钟数">
            <span class="lead-tip">分钟前</span>
          </div>
        </form>
        </div>
      </section>

      <!-- 倒数纪念日的管理在这儿，不在主屏：加纪念日是低频操作，
           放主屏会抬高「打开到勾完」的成本（PRD 的 10 秒判据）。
           主屏那行点一下就跳到这儿 —— 入口唯一，不维护两份界面 -->
      <section class="block" id="annivBlock">
        <h2>倒数纪念日</h2>
        <ul id="annivList"></ul>
        <div class="empty" id="annivEmpty" hidden>还没有纪念日，在下面加一个。</div>
        <form class="rem-form" id="annivForm" autocomplete="off">
          <div class="rem-row">
            <input class="add-input" id="anTitle" type="text" placeholder="名称，比如「期末」…" aria-label="纪念日名称">
            <input class="add-input an-date" id="anDate" type="date" aria-label="纪念日日期">
            <button class="add-btn" type="submit" aria-label="添加纪念日">+</button>
          </div>
          <label class="an-yearly">
            <input type="checkbox" id="anYearly">
            <span>每年重复（生日、周年）</span>
          </label>
        </form>
      </section>
    </div>

    <div class="view" id="viewDone">
      <section class="block" id="doneBlock">
        <h2>已完成</h2>

        <div class="empty" id="doneEmpty" hidden>还没有完成过的事项，去清单里勾掉一条。</div>

    </div>

    <footer class="foot">
      <span id="tip">数据只存在这台设备的浏览器里</span>
      <button class="link" id="clearSeed" hidden>清空示例</button>
    </footer>
  </main>

  <!-- Day 11：删除后的退路。刻意放在 .app 之外，列表重绘不会把它一起刷掉 -->
  <div class="undo" id="undoBar" role="status" aria-live="polite" aria-hidden="true">
    <span class="undo-text" id="undoText"></span>
    <button class="undo-btn" id="undoBtn" type="button">撤销</button>
  </div>

  <script>
    // ---------- 存储层（F4）----------
    var KEY = 'habit-checkin:v1';

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function todayStr() {
      var d = new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function load() {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var data = JSON.parse(raw);
        if (!data || !Array.isArray(data.items)) return null;
        // 老数据（v1）里没有 courses / anniv 这两个字段 —— 按「有没有」补默认值，
        // 而不是换存储格式。这样升级不会碰到任何一条已有的清单和提醒。
        return {
          items: data.items,
          reminders: Array.isArray(data.reminders) ? data.reminders : [],
          courses: Array.isArray(data.courses) ? data.courses : [],
          anniv: Array.isArray(data.anniv) ? data.anniv : [],
          seeded: !!data.seeded
        };
      } catch (e) {
        return null;
      }
    }

    // 演示态（?state=mock / ?state=empty）一律不写盘。
    // boot() 里已经挡了一次「进来就写」，但增删改这些操作各自还会调 save() ——
    // 只要漏掉这一道，在演示态里加一条就会把假数据写进真实存储，把真数据整个顶掉，
    // 而且是静默的：页面上看着一切正常，刷新之后真实数据已经没了。
    function isDemo() { return FORCE_STATE === 'mock' || FORCE_STATE === 'empty'; }

    function save() {
      if (isDemo()) return;
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
      } catch (e) {
        document.getElementById('tip').textContent = '保存失败：浏览器存储不可用';
      }
    }

    // ---------- Mock 数据源 ----------
    // 第 3 周接真实 API 时，只替换 fetchState() 内部这一小块；UI 层一行都不用改
    var MOCK = {
      items: ['买咖啡豆', '复习第三章', '取快递'],
      reminders: [
        { title: '高铁去上海', hours: 5, lead: 90 },
        { title: '作业截止', hours: 9, lead: 0 }
      ]
    };

    function localInputValue(hoursFromNow) {
      var d = new Date(Date.now() + hoursFromNow * 3600000);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    // 主屏蓝图的两块占位数据（倒数日 / 今天的课）。真实功能排到那天时，把这里换成真数据源。
    // 时间点刻意用「相对当前」生成 —— 写死钟点的话，换个时间打开就看不到「正在上」的高亮了。
    function mockHM(offsetMin) {
      var d = new Date(Date.now() + offsetMin * 60000);
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function mockDate(offsetDays) {
      var d = new Date(Date.now() + offsetDays * 86400000);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    // withBlueprint=true 才带上蓝图那两块占位数据。首次打开（当种子用）时必须是 false ——
    // 否则真实用户第一次打开会看到假的「高等数学」和「距期末 23 天」，那是误导不是演示。
    function mockState(withBlueprint) {
      var t = todayStr();
      var now = new Date().toISOString();
      return {
        items: MOCK.items.map(function (title) {
          return { id: uid(), title: title, date: t, done: false, createdAt: now, doneAt: null };
        }),
        reminders: MOCK.reminders.map(function (r) {
          return { id: uid(), title: r.title, at: localInputValue(r.hours), lead: r.lead, done: false };
        }),
        // 第一节「正在上」（当前时间前 5 分钟开始，一节 100 分钟），第二节在今天晚些时候
        courses: withBlueprint ? [
          { title: '高等数学', place: 'A203', start: mockHM(-5), end: mockHM(95) },
          { title: '大学英语', place: 'B105', start: mockHM(240), end: mockHM(340) }
        ] : [],
        anniv: withBlueprint ? [
          { id: uid(), title: '期末', date: mockDate(23) }
        ] : [],
        seeded: true
      };
    }

    // 浏览器到底让不让写 localStorage（无痕模式 / 配额满 / 被策略禁用时会 false）
    function storageOk() {
      try {
        localStorage.setItem('__probe__', '1');
        localStorage.removeItem('__probe__');
        return true;
      } catch (e) {
        return false;
      }
    }

    // 取数据 —— 异步、且可能失败。
    // 这一层存在的意义：让「加载中」和「错误」两种状态在技术上成立。
    // 同步读 localStorage 的版本无处安放这两种状态，因为它不会慢、也不会报错。
    function fetchState() {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          try {
            if (FORCE_STATE === 'error') throw new Error('模拟：取数据失败');
            if (FORCE_STATE === 'loading') return;          // 一直停在加载态
            if (FORCE_STATE === 'mock') {                   // 强制假数据版（演示/截图），不落盘
              resolve(mockState(true));
              return;
            }
            if (FORCE_STATE === 'empty') {                  // 强制空数据版（演示空态），不落盘
              resolve({ items: [], reminders: [], courses: [], anniv: [], seeded: false });
              return;
            }
            if (!storageOk()) throw new Error('浏览器不允许读写本地存储（可能开着无痕模式）');
            resolve(load() || mockState());
          } catch (e) {
            reject(e);
          }
        }, 600);   // 模拟一次网络往返；接真 API 后这里换成 fetch
      });
    }

    var FORCE_STATE = new URLSearchParams(location.search).get('state');
    var state = null;

    // ---------- 渲染 ----------
    var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

    // ---------- 视图路由（Day 13 建 · Day 14 换成原生横滑）----------
    // 三个视图常驻同一份 DOM：切走再切回，谁的输入框里打了字、筛选停在哪个条件，
    // 全都还在 —— 不用自己存现场。
    // Day 14 的两处关键改动：
    //   ① 不再用 hidden 切换 —— hidden 会让相邻页在滑动过程中是空白的，看着像掉帧；
    //      改成外层 #views 做浏览器原生横向滚动 + scroll-snap，惯性/回弹/跟手全交给系统。
    //   ② 非当前页用 inert 摘出焦点顺序和读屏（浏览器不认 inert 时退回 aria-hidden）。
    var VIEWS = { today: 'viewToday', reminders: 'viewReminders', done: 'viewDone' };
    var VIEW_ORDER = ['today', 'reminders', 'done'];
    var viewsEl = document.getElementById('views');
    var tabInd = document.getElementById('tabInd');
    var syncingScroll = 0;     // 程序滚动的时间戳：这段时间里的 scroll 不算「用户滑的」

    function currentView() {
      var v = location.hash.replace(/^#\/?/, '');
      return VIEWS[v] ? v : 'today';          // 认不出的 hash 一律回今日清单
    }

    function viewIndex(name) {
      var i = VIEW_ORDER.indexOf(name);
      return i < 0 ? 0 : i;
    }

    function scrollToView(name) {
      var w = viewsEl.clientWidth;
      if (!w) return false;                                  // 还没布局（加载态把 #views 藏了），等下一轮
      var left = viewIndex(name) * w;
      if (Math.abs(viewsEl.scrollLeft - left) < 2) return false;   // 已经在这一页，别白滚一次
      syncingScroll = Date.now();
      viewsEl.scrollTo({ left: left, behavior: 'smooth' });
      return true;
    }

    // 选中指示条：参数是「小数页码」，0 = 第 1 页，1.4 = 正滑向第 2 页的 40%。
    // 手指一动它就动，等滑停了才更新 —— 那是上一次被嫌「滑得慢」的原因。
    function paintInd(frac) {
      tabInd.style.transform = 'translateX(' + (frac * 100) + '%)';
    }

    function setActiveTab(name) {
      Array.prototype.forEach.call(document.getElementById('tabs')
        .querySelectorAll('.tab'), function (b) {
          var on = b.getAttribute('data-v') === name;
          b.classList.toggle('is-on', on);
          b.setAttribute('aria-selected', on ? 'true' : 'false');   // 读屏器知道当前在第几个视图
        });
    }

    function applyRoute() {
      var v = currentView();
      Object.keys(VIEWS).forEach(function (name) {
        var el = document.getElementById(VIEWS[name]);
        var on = (name === v);
        el.inert = !on;
        el.setAttribute('aria-hidden', on ? 'false' : 'true');
      });
      setActiveTab(v);
      // 没真的滚（已经在这一页 / 还没布局）时不会有 scroll 事件，指示条得自己到位
      if (!scrollToView(v)) paintInd(viewIndex(v));
    }

    // 滑动期间：指示条实时跟手；地址栏等滑停了再同步
    var settleTimer = null;
    var lastIdx = 0;
    viewsEl.addEventListener('scroll', function () {
      var w = viewsEl.clientWidth;
      if (!w) return;
      var frac = viewsEl.scrollLeft / w;
      paintInd(frac);                                        // ① 指示条：永远跟手，不看是谁触发的滚动
      var i = Math.round(frac);
      if (i !== lastIdx) {                                   // ② 文字高亮：过半就换，不等滑停
        lastIdx = i;
        setActiveTab(VIEW_ORDER[i] || 'today');
      }
      if (Date.now() - syncingScroll < 400) return;          // 这是程序滚动自己触发的（平滑滚动约 300ms）
      clearTimeout(settleTimer);
      settleTimer = setTimeout(function () {
        var w = viewsEl.clientWidth;
        if (!w) return;
        var name = VIEW_ORDER[Math.round(viewsEl.scrollLeft / w)] || 'today';
        if (name === currentView()) return;
        syncingScroll = Date.now();                          // 改 hash 会回灌 applyRoute，别再滚一次
        location.hash = '#/' + name;
      }, 120);
    }, { passive: true });

    document.getElementById('tabs').addEventListener('click', function (e) {
      var btn = e.target.closest('.tab');
      if (!btn) return;
      location.hash = '#/' + btn.getAttribute('data-v');          // 改地址 → 交给 hashchange 处理
    });

    window.addEventListener('hashchange', applyRoute);
    // 首次进来没有 hash：补一个，地址栏立刻显示当前在哪个视图（截图也靠它）
    if (!location.hash) history.replaceState(null, '', location.pathname + location.search + '#/today');
    applyRoute();

    // ---------- 筛选（Day 12）----------
    // filterMode: 'all' | 'open'。曾经这里还有个「已完成」，Day 13 删了 ——
    // 已完成归到独立视图，筛选条的活只是在「今天要干的活」里收窄一下，两边不重叠。
    var filterMode = 'all';

    function applyFilter(list) {
      if (filterMode === 'open') return list.filter(function (i) { return !i.done; });
      return list;
    }

    var filterBar = document.getElementById('filterBar');
    filterBar.addEventListener('click', function (e) {
      var btn = e.target.closest('.filter-btn');
      if (!btn) return;
      filterMode = btn.getAttribute('data-f');
      Array.prototype.forEach.call(filterBar.children, function (b) {
        var on = b === btn;
        b.classList.toggle('is-on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');   // 读屏器能知道当前停在哪个条件
      });
      render();
    });

    function render() {
      var today = todayStr();
      var d = new Date();
      document.getElementById('today').textContent =
        (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
      document.getElementById('week').textContent =
        d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' · ' + WEEK[d.getDay()];

      var todays = state.items.filter(function (i) { return i.date === today; });
      var done = todays.filter(function (i) { return i.done; }).length;
      var progressEl = document.getElementById('progress');
      var allDone = todays.length > 0 && done === todays.length;
      progressEl.className = 'progress' + (allDone ? ' is-done' : '');
      progressEl.innerHTML =
        '<span class="pg">' +
          '<span class="pg-num">' + done +
            '<span class="pg-tot">/' + todays.length + '</span>' +
          '</span>' +
          '<span class="pg-label">完成</span>' +
        '</span>' +
        '<span class="pg-track"><i></i></span>';
      progressEl.style.setProperty('--pct',
        todays.length ? Math.round(done / todays.length * 100) + '%' : '0%');

      // 逾期 = 未完成 且 日期早于今天（YYYY-MM-DD 可直接字符串比较）
      var overdue = state.items
        .filter(function (i) { return !i.done && i.date < today; })
        .sort(function (a, b) { return a.date < b.date ? -1 : 1; });

      // 空态两条腿：今天压根没加事项 → emptyHint；加了但当前筛不出来 → filterEmpty
      var shown = applyFilter(todays);
      document.getElementById('emptyHint').hidden = todays.length !== 0;
      document.getElementById('filterEmpty').hidden = !(todays.length > 0 && shown.length === 0);

      // 主屏蓝图的两块占位：没数据时各自隐藏，真实使用不受影响
      renderAnniv(state.anniv);
      renderClasses(state.courses);
      renderAnnivList();

      renderOverdue(overdue, today);
      renderToday(shown);
      renderReminders();
      renderDone();
      document.getElementById('clearSeed').hidden = !state.seeded;
    }

    // ---------- 提醒（F2）----------
    // 提醒时刻 = 事件时刻 − 提前量（A4：14:00 提前 90 分 → 10:30 就该响）
    function remindViews() {
      var now = Date.now();
      return state.reminders.map(function (r) {
        var at = new Date(r.at).getTime();
        var remindAt = at - (r.lead || 0) * 60000;
        return {
          r: r,
          at: at,
          remindAt: remindAt,
          hi: !r.done && now >= remindAt && at >= now,   // 已到提醒时刻 且 事件还没过 → 高亮
          past: at < now                                  // 事件时间已过 → 标红（B2）
        };
      }).sort(function (a, b) {
        if (a.r.done !== b.r.done) return a.r.done ? 1 : -1;   // 完成的排末尾（F2.5）
        if (a.hi !== b.hi) return a.hi ? -1 : 1;               // 高亮置顶（F2.3）
        return a.remindAt - b.remindAt;                        // 其余按提醒时刻升序（F2.2）
      });
    }

    function fmtTime(dt) {
      var md = (dt.getMonth() + 1) + '/' + dt.getDate();
      return md + ' ' + pad(dt.getHours()) + ':' + pad(dt.getMinutes());
    }

    function renderReminders() {
      var ul = document.getElementById('remindList');
      var views = remindViews();
      ul.innerHTML = '';
      document.getElementById('remEmpty').hidden = views.length > 0;

      // 折叠状态下列表是看不见的，所以待办条数必须写在标题上
      var pending = views.filter(function (v) { return !v.r.done; }).length;
      var cnt = document.getElementById('remCount');
      cnt.textContent = pending ? String(pending) : '';
      cnt.hidden = pending === 0;

      views.forEach(function (v) {
        var r = v.r;
        var li = document.createElement('li');
        li.className = (r.done ? 'done ' : '') + (v.hi ? 'hi ' : '') + (v.past && !r.done ? 'past ' : '');

        var dot = document.createElement('button');
        dot.className = 'dot' + (r.done ? ' on' : '');
        dot.textContent = r.done ? '✓' : '';
        dot.setAttribute('aria-label', '标记提醒完成');

        var main = document.createElement('div');
        main.className = 'rm-main';

        var title = document.createElement('span');
        title.className = 'title';
        title.textContent = r.title;

        var meta = document.createElement('span');
        meta.className = 'rm-meta';
        if (r.done) {
          meta.textContent = '已完成 · ' + fmtTime(new Date(v.at));
        } else if (v.past) {
          meta.textContent = '已过期 · ' + fmtTime(new Date(v.at));
        } else if (v.hi) {
          meta.textContent = '现在！事件 ' + fmtTime(new Date(v.at)) +
            (r.lead ? '（已提前 ' + r.lead + ' 分钟）' : '');
        } else {
          meta.textContent = fmtTime(new Date(v.at)) + ' 的事件 · ' +
            (r.lead ? '提前 ' + r.lead + ' 分 → ' + fmtTime(new Date(v.remindAt)) + ' 提醒' : '到点提醒');
        }

        main.appendChild(title);
        main.appendChild(meta);

        var del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = '删除';
        del.setAttribute('aria-label', '删除');

        dot.addEventListener('click', function () { toggleReminder(r.id); });
        del.addEventListener('click', function () { removeReminder(r.id); });

        li.appendChild(dot);
        li.appendChild(main);
        li.appendChild(del);
        ul.appendChild(li);
      });

      // 导出按钮状态：可导出条数 + 那句必须写明的代价
      var n = exportable(views).length;
      document.getElementById('exportBtn').disabled = n === 0;
      document.getElementById('exportTip').textContent = n === 0
        ? '没有可导出的提醒（已完成、已过期的不进日历）'
        : '可导出 ' + n + ' 条 · 改了提醒要重新导出导入一次';

      // 到点的提醒不能藏在折叠里；但只自动开一次，否则用户手动收起后又被弹开
      if (!remAutoOpened && views.some(function (v) { return v.hi; })) {
        remAutoOpened = true;
        document.getElementById('remBlock').open = true;
      }

      // 供定时器比对：只有状态真变了才重绘（避免每半分钟闪一下）
      lastSig = views.map(function (v) {
        return v.r.id + (v.hi ? '!' : '') + (v.past ? '~' : '') + (v.r.done ? '#' : '');
      }).join(',');
    }

    var lastSig = '';
    var remAutoOpened = false;

    // 提醒区的折叠状态单独存一个 key —— 不进 state，也就不影响数据 schema 和 .ics 导出
    var REM_OPEN_KEY = 'habit.rem.open';
    function initRemFold() {
      var el = document.getElementById('remBlock');
      var saved = null;
      try { saved = localStorage.getItem(REM_OPEN_KEY); } catch (e) {}
      if (saved === '1') el.open = true;                 // 上次是展开的就保持展开
      el.addEventListener('toggle', function () {
        try { localStorage.setItem(REM_OPEN_KEY, el.open ? '1' : '0'); } catch (e) {}
      });
    }

    // ---------- 日历导出（F6）----------
    // 只导「未完成 且 事件时间还没到」—— 已过期/已完成的进了日历也不会响（F6.1 / F6.4）
    function exportable(views) {
      return views.filter(function (v) { return !v.r.done && !v.past; });
    }

    function icsEscape(s) {
      return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;')
        .replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    }

    // 本地浮动时间：20260923T140000（不带 Z，日历 App 按设备本地时区解释）
    function icsLocal(dt) {
      return dt.getFullYear() + pad(dt.getMonth() + 1) + pad(dt.getDate()) + 'T' +
        pad(dt.getHours()) + pad(dt.getMinutes()) + '00';
    }

    // DTSTAMP 必须是 UTC（RFC 5545）
    function icsUtc(dt) {
      return dt.getUTCFullYear() + pad(dt.getUTCMonth() + 1) + pad(dt.getUTCDate()) + 'T' +
        pad(dt.getUTCHours()) + pad(dt.getUTCMinutes()) + pad(dt.getUTCSeconds()) + 'Z';
    }

    function buildIcs(list) {
      var lines = [
        'BEGIN:VCALENDAR', 'VERSION:2.0',
        'PRODID:-//habit-checkin//ZH//CN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'
      ];
      var stamp = icsUtc(new Date());

      list.forEach(function (v) {
        var r = v.r;
        var dt = new Date(v.at);
        lines.push('BEGIN:VEVENT');
        lines.push('UID:' + r.id + '@habit-checkin');       // 稳定 UID：重复导入=更新（B5）
        lines.push('DTSTAMP:' + stamp);
        lines.push('DTSTART:' + icsLocal(dt));
        lines.push('DTEND:' + icsLocal(new Date(v.at + 30 * 60000)));
        lines.push('SUMMARY:' + icsEscape(r.title));
        lines.push('DESCRIPTION:' + icsEscape('来自每日打卡清单（提前 ' + (r.lead || 0) + ' 分钟）'));
        lines.push('BEGIN:VALARM');
        lines.push('ACTION:DISPLAY');
        lines.push('TRIGGER:-PT' + (r.lead || 0) + 'M');     // 提前量 → 系统日历的闹钟（F6.2）
        lines.push('DESCRIPTION:' + icsEscape(r.title));
        lines.push('END:VALARM');
        lines.push('END:VEVENT');
      });

      lines.push('END:VCALENDAR');
      return lines.join('\r\n');
    }

    document.getElementById('exportBtn').addEventListener('click', function () {
      var list = exportable(remindViews());
      if (list.length === 0) return;
      var blob = new Blob([buildIcs(list)], { type: 'text/calendar;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'habit-checkin-reminders.ics';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    });

    function toggleReminder(id) {
      state.reminders.forEach(function (r) {
        if (r.id === id) r.done = !r.done;
      });
      save();
      render();
    }

    function removeReminder(id) {
      state.reminders = state.reminders.filter(function (r) { return r.id !== id; });
      save();
      render();
    }

    function daysAgo(dateStr, today) {
      var a = new Date(dateStr + 'T00:00:00');
      var b = new Date(today + 'T00:00:00');
      return Math.round((b - a) / 86400000);
    }

    function renderOverdue(list, today) {
      var block = document.getElementById('overdueBlock');
      var ul = document.getElementById('overdueList');
      block.hidden = list.length === 0;
      if (list.length === 0) { ul.innerHTML = ''; return; }

      document.getElementById('overdueCount').textContent = '(' + list.length + ')';
      ul.innerHTML = '';

      list.forEach(function (item) {
        var li = document.createElement('li');
        li.className = 'od';

        var main = document.createElement('div');
        main.className = 'od-main';

        var title = document.createElement('span');
        title.className = 'title';
        title.textContent = item.title;

        var meta = document.createElement('span');
        meta.className = 'od-date';
        var n = daysAgo(item.date, today);
        meta.textContent = item.date.slice(5).replace('-', ' 月 ') + ' 日 · 已过 ' + n + ' 天';

        main.appendChild(title);
        main.appendChild(meta);

        var move = document.createElement('button');
        move.className = 'act';
        move.textContent = '挪到今天';
        move.addEventListener('click', function () { moveToToday(item.id); });

        var del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = '删除';
        del.setAttribute('aria-label', '删除');
        del.addEventListener('click', function () { removeItem(item.id); });

        li.appendChild(main);
        li.appendChild(move);
        li.appendChild(del);
        ul.appendChild(li);
      });
    }

    function moveToToday(id) {
      var t = todayStr();
      state.items.forEach(function (i) {
        if (i.id === id) i.date = t;
      });
      save();
      render();
    }

    function renderToday(list) {
      var ul = document.getElementById('todayList');
      ul.innerHTML = '';
      // 空态提示由 render() 统一管理：筛选模式下必须区分「今天没事项」和「筛完没有」

      list.forEach(function (item) {
        var li = document.createElement('li');
        if (item.done) li.className = 'done';

        var dot = document.createElement('button');
        dot.className = 'dot' + (item.done ? ' on' : '');
        dot.textContent = item.done ? '✓' : '';
        dot.setAttribute('aria-label', '切换完成状态');

        var title = document.createElement('span');
        title.className = 'title';
        title.textContent = item.title;

        var del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = '删除';
        del.setAttribute('aria-label', '删除');

        dot.addEventListener('click', function () { toggleItem(item.id); });
        del.addEventListener('click', function () { removeItem(item.id); });
        // 整行可点：方框和删除键各自处理，行内其余位置点下去都算「勾一下」
        li.addEventListener('click', function (e) {
          if (e.target.closest('.dot') || e.target.closest('.del')) return;
          toggleItem(item.id);
        });

        li.appendChild(dot);
        li.appendChild(title);
        li.appendChild(del);
        ul.appendChild(li);
      });
    }

    // ---------- 主屏蓝图：倒数日 + 今天的课（占位渲染，等真功能接数据）----------
    // 两条铁律：① 没数据就整块隐藏，真实使用零影响；② 假数据只在 ?state=mock 下出现。
    function daysUntil(dateStr) {
      var t = new Date(todayStr() + 'T00:00:00').getTime();
      var d = new Date(dateStr + 'T00:00:00').getTime();
      return Math.round((d - t) / 86400000);
    }

    /* ---------- 纪念日：每年重复 ---------- */
    // 闰日兜底：2-29 平年不存在，new Date('2026-02-29') 会静默溢到 3-1，
    // 所以解析完必须回查月日是否还对得上，对不上就退化到 2-28。
    function annivDateOfYear(y, mmdd) {
      var s = y + '-' + mmdd;
      var d = new Date(s + 'T00:00:00');
      var ok = !isNaN(d.getTime()) &&
        d.getMonth() === parseInt(mmdd.slice(0, 2), 10) - 1 &&
        d.getDate() === parseInt(mmdd.slice(3, 5), 10);
      return ok ? s : y + '-02-28';
    }

    // 这个纪念日的「下一次」是哪天 —— 年度重复的会自动滚到下一次，所以永远不会变成「已过去」。
    // 返回 { date: 'YYYY-MM-DD', nth: 第几次（仅年度重复有；生日第 26 个、结婚 5 周年） }
    function annivNext(a) {
      if (!a.yearly) return { date: a.date, nth: null };
      var today = todayStr();
      var mmdd = a.date.slice(5);
      var y0 = parseInt(a.date.slice(0, 4), 10);
      var yNow = parseInt(today.slice(0, 4), 10);
      // 今年那次还没到（或就是今天）→ 就是今年；已经过了 → 看明年
      var yTarget = annivDateOfYear(yNow, mmdd) >= today ? yNow : yNow + 1;
      return { date: annivDateOfYear(yTarget, mmdd), nth: yTarget - y0 };
    }

    function renderAnniv(list) {
      var bar = document.getElementById('annivBar');
      if (!list || !list.length) { bar.hidden = true; return; }
      // 只倒数未来的那一个（annivSorted 已按「未来的在前、刚过去的在后」排好）。
      // 全都过去了就整条隐藏 —— 倒数日的意义在未来，已经过去的日子归管理列表管，
      // 那里还能看到「已过去 N 天」，主屏没必要为它留位置。
      var near = annivSorted()[0];
      var nx = near && annivNext(near);
      if (!near || daysUntil(nx.date) < 0) { bar.hidden = true; return; }
      var n = daysUntil(nx.date);
      var nth = nx.nth > 0 ? ' · 第 ' + nx.nth + ' 个' : '';
      document.getElementById('annivText').textContent =
        n > 0 ? '距' + near.title + '还有 ' + n + ' 天' + nth
          : '就是今天 · ' + near.title + nth;
      bar.hidden = false;
    }

    // 排序规则：未来的按「还有几天」升序在前，过去的按「刚过去」在前排后面。
    // 直接按天数升序会把过期最久的顶到第一位 —— 那是倒数条最不该显示的一条。
    // 年度重复要按「下一次」的日子排 —— 生日过了自动滚到明年，不会掉进 past。
    function annivSorted() {
      var future = [], past = [];
      (state.anniv || []).forEach(function (a) {
        (daysUntil(annivNext(a).date) >= 0 ? future : past).push(a);
      });
      future.sort(function (a, b) {
        return daysUntil(annivNext(a).date) - daysUntil(annivNext(b).date);
      });
      past.sort(function (a, b) {
        return daysUntil(annivNext(b).date) - daysUntil(annivNext(a).date);
      });
      return future.concat(past);
    }

    function renderAnnivList() {
      var ul = document.getElementById('annivList');
      ul.innerHTML = '';
      var list = annivSorted();
      document.getElementById('annivEmpty').hidden = list.length > 0;

      list.forEach(function (a) {
        var nx = annivNext(a);
        var n = daysUntil(nx.date);
        var li = document.createElement('li');
        li.className = n < 0 ? 'an-past' : '';

        var main = document.createElement('div');
        main.className = 'rm-main';
        var title = document.createElement('span');
        title.className = 'title';
        title.textContent = a.title + (a.yearly ? ' ↻' : '');
        var meta = document.createElement('span');
        meta.className = 'rm-meta';
        // 年度重复显示「每年 MM-DD」+ 第几次；一次性显示完整日期。
        // 一次性且已过去 → 「已过去 N 天」，这就是「我们相遇已经有几天」那个数。
        var when = a.yearly ? '每年 ' + a.date.slice(5) : a.date;
        var nthTxt = nx.nth > 0 ? ' · 第 ' + nx.nth + ' 个' : '';
        meta.textContent = when + ' · ' +
          (n > 0 ? '还有 ' + n + ' 天' : n === 0 ? '就是今天' : '已过去 ' + (-n) + ' 天') + nthTxt;
        main.appendChild(title);
        main.appendChild(meta);

        var del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = '删除';
        del.setAttribute('aria-label', '删除纪念日');
        del.addEventListener('click', function () { removeAnniv(a.id); });

        li.appendChild(main);
        li.appendChild(del);
        ul.appendChild(li);
      });
    }

    function addAnniv(title, date, yearly) {
      state.anniv.push({ id: uid(), title: title, date: date, yearly: !!yearly });
      save();
      render();
    }

    function removeAnniv(id) {
      var index = -1;
      state.anniv.forEach(function (a, n) { if (a.id === id) index = n; });
      if (index < 0) return;
      pendingUndo = { kind: 'anniv', item: state.anniv[index], index: index };
      state.anniv.splice(index, 1);
      save();
      render();
      showUndo('已删除纪念日「' + pendingUndo.item.title + '」');
    }

    function hhmmToMin(hhmm) {
      var p = String(hhmm).split(':');
      return (+p[0]) * 60 + (+p[1]);
    }

    function renderClasses(list) {
      var block = document.getElementById('classBlock');
      var ul = document.getElementById('classList');
      ul.innerHTML = '';
      if (!list || !list.length) { block.hidden = true; return; }
      block.hidden = false;

      var now = new Date();
      var nowMin = now.getHours() * 60 + now.getMinutes();

      list.forEach(function (c) {
        var s = hhmmToMin(c.start);
        var e = hhmmToMin(c.end);
        var isNow = nowMin >= s && nowMin < e;
        var isPast = nowMin >= e;

        var li = document.createElement('li');
        li.className = 'cs' + (isNow ? ' is-now' : '') + (isPast ? ' is-past' : '');

        var time = document.createElement('span');
        time.className = 'cs-time';
        time.textContent = c.start;

        var main = document.createElement('span');
        main.className = 'cs-main';
        var title = document.createElement('span');
        title.className = 'cs-title';
        title.textContent = c.title;
        main.appendChild(title);
        if (c.place) {
          var meta = document.createElement('span');
          meta.className = 'cs-meta';
          meta.textContent = c.place;
          main.appendChild(meta);
        }

        li.appendChild(time);
        li.appendChild(main);

        // 上课中提示还剩多久；还没上的，只在两小时内才提示（一整天的倒计时没意义）
        var tip = '';
        if (isNow) tip = '还有 ' + (e - nowMin) + ' 分钟下课';
        else if (!isPast && s - nowMin <= 120) tip = '还有 ' + (s - nowMin) + ' 分钟';
        if (tip) {
          var tipEl = document.createElement('span');
          tipEl.className = 'cs-tip';
          tipEl.textContent = tip;
          li.appendChild(tipEl);
        }
        ul.appendChild(li);
      });
    }

    // ---------- 已完成视图（Day 13）----------
    // 不新增数据结构：从现有 items 里挑 done 的，按完成时间倒序
    function renderDone() {
      var ul = document.getElementById('doneList');
      ul.innerHTML = '';
      var doneItems = state.items
        .filter(function (i) { return i.done; })
        .sort(function (a, b) { return (b.doneAt || '') < (a.doneAt || '') ? -1 : 1; });
      document.getElementById('doneEmpty').hidden = doneItems.length > 0;

      doneItems.forEach(function (item) {
        var li = document.createElement('li');
        li.className = 'done';

        var dot = document.createElement('button');
        dot.className = 'dot on';
        dot.textContent = '✓';
        dot.setAttribute('aria-label', '取消完成');

        var main = document.createElement('div');
        main.className = 'rm-main';
        var title = document.createElement('span');
        title.className = 'title';
        title.textContent = item.title;
        var meta = document.createElement('span');
        meta.className = 'rm-meta';
        meta.textContent = item.doneAt ? fmtTime(new Date(item.doneAt)) + ' 完成' : '已完成';
        main.appendChild(title);
        main.appendChild(meta);

        var del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = '删除';
        del.setAttribute('aria-label', '删除');

        dot.addEventListener('click', function () { toggleItem(item.id); });
        del.addEventListener('click', function () { removeItem(item.id); });

        li.appendChild(dot);
        li.appendChild(main);
        li.appendChild(del);
        ul.appendChild(li);
      });
    }

    function toggleItem(id) {
      state.items.forEach(function (i) {
        if (i.id === id) {
          i.done = !i.done;
          i.doneAt = i.done ? new Date().toISOString() : null;
        }
      });
      save();
      render();
    }

    function removeItem(id) {
      var index = -1;
      state.items.forEach(function (i, n) { if (i.id === id) index = n; });
      if (index < 0) return;
      // 删之前先记住「删的是谁、它原本排第几」——撤销要放回原位，不是补到末尾。
      // kind 标明是哪种数组，撤销时才知道该插回哪里（清单项和纪念日是两套数组）
      pendingUndo = { kind: 'item', item: state.items[index], index: index };
      state.items.splice(index, 1);
      save();
      render();
      showUndo('已删除「' + pendingUndo.item.title + '」');
    }

    // ---------- 撤销条：反馈层③「可以反悔」 ----------
    // 删除是这个页面上唯一没法回头的操作。Day 10 把整行改成可点之后，手指落在行里时
    // ✕ 就在手边，误触概率反而高了 —— 退路必须补上，不然每次点错都是真的丢一条。
    var UNDO_MS = 2600;                 // 撤销条的停留时长（原 4000，实测嫌长；再短会来不及点）
    var pendingUndo = null;             // { kind, item, index }：一次只挂一笔，删新的会顶掉旧的
    var undoTimer = null;

    var undoBar = document.getElementById('undoBar');
    var undoText = document.getElementById('undoText');
    var undoBtn = document.getElementById('undoBtn');

    function showUndo(msg) {
      undoText.textContent = msg;
      undoBar.classList.add('show');
      undoBar.setAttribute('aria-hidden', 'false');
      clearTimeout(undoTimer);
      undoTimer = setTimeout(hideUndo, UNDO_MS);
    }

    function hideUndo() {
      clearTimeout(undoTimer);
      undoTimer = null;
      pendingUndo = null;               // 过期作废：原件已经丢掉，再也回不来了
      undoBar.classList.remove('show');
      undoBar.setAttribute('aria-hidden', 'true');
    }

    function undoRemove() {
      if (!pendingUndo) return;
      var p = pendingUndo;
      hideUndo();                       // 机会用掉了，顺手把计时器和浮层收干净
      // 清单项和纪念日各存各的数组，按 kind 决定插回哪一支
      var arr = p.kind === 'anniv' ? state.anniv : state.items;
      arr.splice(Math.min(p.index, arr.length), 0, p.item);
      save();
      render();
    }

    undoBtn.addEventListener('click', undoRemove);

    function addItem(title) {
      state.items.push({
        id: uid(),
        title: title,
        date: todayStr(),
        done: false,
        createdAt: new Date().toISOString(),
        doneAt: null
      });
      save();
      render();
    }

    var addInput = document.getElementById('addInput');
    document.getElementById('addForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = addInput.value.trim();
      if (!title) return;
      addItem(title);
      addInput.value = '';
      addInput.focus();
    });

    var remTitle = document.getElementById('remTitle');
    var remAt = document.getElementById('remAt');
    var remLead = document.getElementById('remLead');
    document.getElementById('remForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = remTitle.value.trim();
      if (!title) return;                                   // 空标题：无反应（B1 同款）
      if (!remAt.value) { remAt.focus(); return; }           // 时间必填
      var lead = parseInt(remLead.value, 10);
      if (isNaN(lead) || lead < 0) lead = 0;

      state.reminders.push({
        id: uid(),
        title: title,
        at: remAt.value,        // "YYYY-MM-DDTHH:mm" 本地时间
        lead: lead,
        done: false
      });
      save();
      render();
      remTitle.value = '';
      remLead.value = '0';
      remTitle.focus();
    });

    var anTitle = document.getElementById('anTitle');
    var anDate = document.getElementById('anDate');
    var anYearly = document.getElementById('anYearly');
    document.getElementById('annivForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = anTitle.value.trim();
      if (!title) return;                                    // 空名称：无反应（B1 同款）
      if (!anDate.value) { anDate.focus(); return; }          // 日期必填
      addAnniv(title, anDate.value, anYearly.checked);
      anTitle.value = '';
      anDate.value = '';
      anYearly.checked = false;
      anTitle.focus();
    });

    // 主屏那一行点了去管理区：不就地展开第二层（主屏要轻），也不另开入口（只维护一份界面）
    var annivBar = document.getElementById('annivBar');
    function gotoAnniv() { location.hash = '#/reminders'; }
    annivBar.addEventListener('click', gotoAnniv);
    annivBar.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); gotoAnniv(); }
    });

    // 到点自动高亮：每 30 秒比对一次状态，只有真变了才重绘（F2.3「不用刷新也能变」）
    setInterval(function () {
      if (!state) return;                                   // 数据还没到（或加载失败），跳过
      var sig = remindViews().map(function (v) {
        return v.r.id + (v.hi ? '!' : '') + (v.past ? '~' : '') + (v.r.done ? '#' : '');
      }).join(',');
      if (sig !== lastSig) render();
    }, 30000);

    document.getElementById('clearSeed').addEventListener('click', function () {
      state.items = [];
      state.seeded = false;
      save();
      render();
    });

    // ---------- 启动 ----------
    // 四态里的「错误」在开发时几乎不会自然出现，所以必须能被强制触发才好验证
    function showError(err) {
      document.body.classList.add('is-error');
      document.getElementById('errorMsg').textContent =
        err.message + '。可以点重试；如果浏览器不让存数据，换普通窗口（别用无痕）再打开。';
    }

    function boot() {
      document.body.classList.remove('is-error');
      document.body.classList.add('is-loading');
      fetchState().then(function (data) {
        state = data;
        // 演示态不写回，绝不碰真实存储（save() 自己也挡了一道，这里是双保险）
        if (!isDemo()) save();
        document.body.classList.remove('is-loading');
        render();
        // 加载态把 #views 藏过（clientWidth 为 0，那一轮滚不动），这里补一次定位
        applyRoute();
      }).catch(function (err) {
        document.body.classList.remove('is-loading');
        showError(err);
      });
    }

    document.getElementById('retryBtn').addEventListener('click', function () {
      // 先把强制失败开关摘掉，否则点了重试还是失败，看着像坏了
      if (FORCE_STATE === 'error') {
        FORCE_STATE = null;
        // 摘掉强制失败的开关（query），但保留 hash —— 在哪儿失败就在哪儿重试，别把人踢回第一个视图
        history.replaceState(null, '', location.pathname + location.hash);
      }
      boot();
    });

    initRemFold();
    boot();
  </script>
</body>
</html>
