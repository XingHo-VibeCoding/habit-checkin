<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日打卡清单</title>
  <style>
    :root {
      --card-1: #faf6ec;
      --card-2: #f2ebda;
      --ink: #2c2a22;
      --muted: #6a6658;
      /* 原 #ddd4bf 与卡片明度只差 11.8，弱光下几乎看不见；加深到差 20.0 */
      --line: #c9bda2;
      --row-line: #e9e2d0;
      --accent: #a3352a;
      /* 军绿：第二个色相家族（88°），管结构性元素。原来整页只有 40-48° 一个黄褐家族，视觉太平 */
      --olive: #5c6650;
      --gold: #7a6130;
      --gold-dim: #8f7a4a;
      --soft: #6c6656;
      /* Day 9 审查后新增：原 #c9705f 在卡片底色上只有 2.96:1，不达 WCAG AA 4.5:1 */
      --danger-ink: #9e4636;
      /* hover 态要比常态更深，不能更浅 */
      --gold-deep: #5c4823;
      --soft-deep: #57523f;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      padding: 20px 16px 32px;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      background:
        radial-gradient(900px 500px at 50% -5%, #fffdf6 0%, rgba(0, 0, 0, 0) 70%),
        linear-gradient(180deg, #f4eddd 0%, #e6dec9 100%);
      background-attachment: fixed;
    }
    /* 做旧纸感：纤维斜纹 + 几处陈旧污渍 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(340px 250px at 14% 20%, rgba(140, 108, 48, 0.09), rgba(0, 0, 0, 0) 70%),
        radial-gradient(280px 210px at 86% 74%, rgba(163, 53, 42, 0.05), rgba(0, 0, 0, 0) 70%),
        repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.02) 0 2px, rgba(0, 0, 0, 0) 2px 4px);
    }
    /* 纸张边缘：四周做旧压深 */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(125% 95% at 50% 38%, rgba(0, 0, 0, 0) 52%, rgba(96, 78, 45, 0.16) 100%);
    }
    .app {
      position: relative;
      z-index: 1;
      max-width: 520px;
      margin: 0 auto;
      padding: 22px 16px 10px;
      border-radius: 3px;
      background: linear-gradient(180deg, var(--card-1), var(--card-2));
      border: 1px solid var(--line);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 14px 34px rgba(70, 58, 34, 0.14);
    }
    /* 顶部警示斜纹条 */
    .app::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 5px;
      background: repeating-linear-gradient(45deg, var(--gold) 0 7px, #efe7d4 7px 14px);
      opacity: 0.85;
    }
    /* 页头招牌：兵团标签（关掉方式：删掉 .corps-bar 这段） */
    .corps-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 2px 0 15px;
    }
    .corps-bar::before,
    .corps-bar::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(143, 122, 74, 0), var(--gold-dim), rgba(143, 122, 74, 0));
    }
    .corps-bar span {
      flex: none;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      color: var(--gold);
    }
    /* 徽章 hover：翅膀轻展（关掉方式：删掉 .w1 .w2 这段） */
    .w1, .w2 {
      transform-box: view-box;
      transform-origin: 24px 19px;
      transition: transform 0.28s ease;
    }
    .brand:hover .w1 { transform: translateX(-2.5px) rotate(-5deg); }
    .brand:hover .w2 { transform: translateX(2.5px) rotate(5deg); }
    @media (prefers-reduced-motion: reduce) { .w1, .w2 { transition: none; } }

    /* 区块之间：城墙砖缝（关掉方式：改回 border-top: 1px solid var(--line)） */
    .block + .block {
      border-top: none;
      padding-top: 24px;
    }
    .block + .block::before {
      content: "";
      display: block;
      height: 9px;
      margin: 0 0 18px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background:
        repeating-linear-gradient(90deg, transparent 0 19px, var(--line) 19px 20px) 0 0 / 100% 4.5px repeat-x,
        repeating-linear-gradient(90deg, transparent 0 9px, var(--line) 9px 10px, transparent 10px 19px) 0 4.5px / 100% 4.5px repeat-x;
      opacity: 0.7;
    }

    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .wing { width: 44px; height: 44px; flex: none; color: var(--gold); opacity: 0.92; }
    .mascot {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin: 10px 0 2px;
      padding: 0 2px 0 0;
      background: none;
      border: none;
    }
    .mascot img {
      width: 76px;
      height: auto;
      flex: none;
      align-self: flex-end;
      filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.22));
      pointer-events: none;
      user-select: none;
    }
    .mascot-bubble {
      flex: 1;
      min-width: 0;
      margin-bottom: 12px;
      padding: 7px 10px 8px;
      background: rgba(0, 0, 0, 0.028);
      border: 1px solid var(--line);
      border-radius: 2px 10px 10px 10px;
    }
    .mascot-name {
      display: block;
      font-size: 10px;
      letter-spacing: 0.24em;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .mascot-line { font-size: 13.5px; line-height: 1.5; color: var(--ink); }
    .date {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.2;
      font-variant-numeric: lining-nums tabular-nums;
    }
    .week {
      display: block;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 3px;
    }
    /* 完成度 —— 「3/5」是打卡产品的情绪核心，必须是全页最大的字（服务 PRD 的 A1 十秒判据） */
    .progress {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      color: var(--ink);
      font-variant-numeric: lining-nums tabular-nums;
    }
    .progress .pg { display: flex; align-items: baseline; gap: 5px; }
    .pg-num {
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.01em;
    }
    .pg-tot { font-size: 15px; font-weight: 600; color: var(--muted); }
    .pg-label {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.22em;
      color: var(--gold);
    }
    /* 全部完成 = 唯一值得用强调色的时刻（锐利色的用法是「少而准」，不是到处撒） */
    .progress.is-done .pg-num,
    .progress.is-done .pg-tot { color: var(--accent); }
    /* 砖墙推进条：从数字背后挪到下方 —— 30px 的字压在纹理上不好读 */
    .pg-track {
      width: 88px;
      height: 4px;
      border-radius: 2px;
      background: rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }
    .pg-track i {
      display: block;
      height: 100%;
      width: var(--pct, 0%);
      background: repeating-linear-gradient(90deg, rgba(176, 58, 46, 0.75) 0 6px, rgba(176, 58, 46, 0.42) 6px 8px);
      transition: width 0.35s ease;
    }
    @media (prefers-reduced-motion: reduce) { .pg-track i { transition: none; } }
    .block { padding: 16px 0 6px; }
    .block h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: var(--gold);
    }
    .block h2::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--gold-dim), rgba(0, 0, 0, 0));
    }
    /* 今日清单是主角：字号提级 + 军绿，跟"提醒"拉开视觉层级 */
    #todayBlock h2 {
      font-size: 14px;
      letter-spacing: 0.18em;
      color: var(--olive);
    }
    #todayBlock h2::after {
      background: linear-gradient(90deg, var(--olive), rgba(0, 0, 0, 0));
    }
    #overdueBlock h2 { color: var(--danger-ink); }
    /* 提醒区默认折叠 —— 它比主角还重，但不是每天都用。标题压浅，让位给今日清单 */
    .fold > summary {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      list-style: none;
    }
    .fold > summary::-webkit-details-marker { display: none; }
    .fold > summary::marker { content: ""; }
    .fold > summary:focus-visible {
      outline: 2px solid var(--gold-deep);
      outline-offset: 3px;
    }
    .fold > summary h2 {
      flex: 1;
      margin-bottom: 0;
      color: var(--muted);
    }
    .fold[open] > summary h2 { margin-bottom: 8px; }
    /* 折叠时也要看得出有几条待办提醒 */
    .fold-count {
      flex: none;
      min-width: 16px;
      padding: 1px 6px;
      border: 1px solid var(--line);
      border-radius: 9px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      text-align: center;
    }
    .fold-count[hidden] { display: none; }
    .fold > summary::after {
      content: "";
      flex: none;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid var(--muted);
      border-bottom: 1.5px solid var(--muted);
      transform: rotate(-45deg);
      margin-top: -3px;
      transition: transform 0.2s ease;
    }
    .fold[open] > summary::after { transform: rotate(45deg); margin-top: 3px; }
    @media (prefers-reduced-motion: reduce) { .fold > summary::after { transition: none; } }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 6px 6px 6px 2px;
      margin: 0 -6px;
      border-bottom: 1px solid var(--row-line);
      border-left: 2px solid transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    li:last-child { border-bottom: none; }
    li:hover { background: rgba(0, 0, 0, 0.04); border-left-color: var(--accent); }
    .dot {
      position: relative;
      flex: none;
      width: 22px;
      height: 22px;
      border: 2px solid #c3bca7;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--ink);
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease, color 0.15s ease;
    }
    .dot:active { transform: scale(0.92); }
    .dot:hover { border-color: var(--gold); }
    .dot.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .title { flex: 1; word-break: break-all; }
    li.done .title { color: var(--soft); text-decoration: line-through; }
    .del {
      position: relative;
      flex: none;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 2px;
      background: none;
      color: var(--soft);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    li:hover .del, .del:focus-visible { opacity: 1; }
    .del:hover { color: #b8392a; background: rgba(163, 53, 42, 0.15); }
    /* 触屏没有 hover，删除键常驻显示；这时必须用更深的墨色，原来 opacity 0.5 只有 1.98:1 */
    @media (hover: none) { .del { opacity: 1; color: var(--soft-deep); } }
    .add { display: flex; gap: 8px; margin-top: 12px; }
    .add-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
    }
    .add-input::placeholder { color: var(--soft); }
    .add-input:focus {
      outline: none;
      border-color: var(--gold-dim);
      background: #fffdf8;
    }
    .add-btn {
      flex: none;
      width: 42px;
      border: 1px solid var(--gold-dim);
      border-radius: 2px;
      background: rgba(138, 111, 55, 0.07);
      color: var(--gold);
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .add-btn:hover { background: rgba(138, 111, 55, 0.16); }
    /* 状态视图：错误 */
    .state-view { display: none; text-align: center; padding: 30px 12px 24px; }
    body.is-error .app > *:not(.state-view) { display: none !important; }
    body.is-error .state-view { display: block; }
    .state-icon {
      width: 46px;
      height: 46px;
      margin: 0 auto 16px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
      color: var(--accent);
      font-size: 24px;
      font-weight: 700;
      line-height: 43px;
    }
    .state-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .state-desc {
      font-size: 12.5px;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 18px;
    }

    /* 加载态：骨架屏 */
    .skeleton { display: none; }
    body.is-loading .app > *:not(.skeleton) { display: none !important; }
    body.is-loading .skeleton { display: block; padding: 4px 0 10px; }
    .sk {
      height: 13px;
      border-radius: 2px;
      margin: 0 0 12px;
      background: linear-gradient(90deg, #e6dfcc 25%, #f2ebda 50%, #e6dfcc 75%);
      background-size: 200% 100%;
      animation: sk-shimmer 1.3s ease-in-out infinite;
    }
    .sk-head { height: 22px; width: 46%; margin-bottom: 20px; }
    .sk:nth-child(2) { width: 92%; }
    .sk:nth-child(3) { width: 78%; }
    .sk:nth-child(4) { width: 85%; }
    .sk:nth-child(5) { width: 64%; }
    @keyframes sk-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

    /* 提醒区 */
    li.hi { background: rgba(138, 111, 55, 0.1); border-left-color: var(--gold); }
    li.hi .title { color: var(--gold); font-weight: 600; }
    li.past .title { color: var(--danger-ink); }
    /* 原来靠 opacity 0.62 做弱化，叠在深色字上只剩 1.9:1；改用底色区分，文字保持全不透明 */
    li.past { opacity: 1; background: rgba(0, 0, 0, 0.025); }
    .rm-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .rm-meta {
      font-size: 11px;
      line-height: 1.3;
      color: var(--muted);
      letter-spacing: 0.03em;
    }
    li.hi .rm-meta { color: var(--gold); letter-spacing: 0.08em; }
    li.past .rm-meta { color: var(--danger-ink); }
    .export-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .export-row .act:disabled { opacity: 0.4; cursor: not-allowed; }
    .export-row .act:disabled:hover { background: rgba(138, 111, 55, 0.07); }
    .export-tip { flex: 1; min-width: 140px; font-size: 11px; color: var(--soft); letter-spacing: 0.02em; }
    .rem-form { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .rem-row { display: flex; gap: 8px; }
    .rem-row .add-input { flex: 1; min-width: 0; }
    .lead-input { flex: none !important; width: 92px; }
    .lead-tip {
      flex: none;
      align-self: center;
      font-size: 11px;
      color: var(--soft);
      letter-spacing: 0.04em;
    }

    /* 逾期区 */
    li.od { border-left: 2px solid var(--accent); background: rgba(163, 53, 42, 0.06); }
    li.od:hover { background: rgba(163, 53, 42, 0.11); border-left-color: #c9453a; }
    .od-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .od-date {
      font-size: 11px;
      line-height: 1.3;
      color: var(--danger-ink);
      letter-spacing: 0.03em;
    }
    .act {
      flex: none;
      padding: 5px 9px;
      border: 1px solid var(--gold-dim);
      border-radius: 2px;
      background: rgba(138, 111, 55, 0.07);
      color: var(--gold);
      font-family: inherit;
      font-size: 11.5px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .act:hover { background: rgba(138, 111, 55, 0.18); }
    li.od .del { opacity: 0.5; }
    li.od:hover .del { opacity: 1; }
    .empty {
      padding: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--soft);
      letter-spacing: 0.08em;
      background: rgba(0, 0, 0, 0.02);
      border: 1px dashed #cfc6ae;
      border-radius: 2px;
    }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 12px 2px 2px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      color: var(--soft);
      letter-spacing: 0.04em;
    }
    .link {
      flex: none;
      border: none;
      background: none;
      color: var(--gold);
      font-size: 11.5px;
      letter-spacing: 0.08em;
      cursor: pointer;
      padding: 4px 2px;
    }
    .link:hover { color: var(--gold-deep); text-decoration: underline; }

    /* ---------- Day 9：触控目标与窄屏 ---------- */
    /* 视觉尺寸不变，用透明伪元素把可点区域撑到 44px（WCAG 2.5.5 / HIG 建议值） */
    .dot::after,
    .del::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
    }
    /* 触屏下把输入框和操作按钮抬到 44px 高，指头点得准 */
    @media (pointer: coarse) {
      .add-input,
      .add-btn,
      .act { min-height: 44px; }
      .act { padding: 8px 12px; }
    }
    /* 窄屏：提醒表单第二行（时间 + 分钟 + 说明）挤不下时换行，避免横向溢出 */
    .rem-row { flex-wrap: wrap; }
    @media (max-width: 380px) {
      .rem-row .lead-input { width: 76px; }
      .lead-tip { flex-basis: 100%; text-align: left; }
    }

    /* ---------- Day 9：键盘焦点可见（WCAG 2.4.7） ---------- */
    /* 之前只有 .del 和 .add-input 处理过焦点，其余控件全靠浏览器默认环 ——
       在羊皮纸底色上不够明确，统一成金棕色描边（对底色 7.34:1，远高于 3:1 要求） */
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible,
    .link:focus-visible {
      outline: 2px solid var(--gold-deep);
      outline-offset: 2px;
    }
    /* 尊重系统「减少动态效果」：此前只降级了三处主动效，装饰性过渡一并关掉 */
    @media (prefers-reduced-motion: reduce) {
      button, input, select, a, .link, .dot, .del { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="skeleton" id="skeleton" aria-hidden="true">
      <div class="sk sk-head"></div>
      <div class="sk"></div>
      <div class="sk"></div>
      <div class="sk"></div>
      <div class="sk"></div>
    </div>
    <div class="state-view" id="errorView">
      <div class="state-icon" aria-hidden="true">!</div>
      <div class="state-title">数据没能读出来</div>
      <div class="state-desc" id="errorMsg"></div>
      <button class="act" id="retryBtn" type="button">重试</button>
    </div>
    <div class="corps-bar"><span>调查兵团 · 每日任务</span></div>
    <header class="head">
      <div class="brand">
        <svg class="wing" viewBox="0 0 48 48" aria-hidden="true">
          <path class="w1" d="M24 18 L14 15 L18.5 19 L11.5 20 L18 23 L14 28 L24 25 Z" fill="currentColor" opacity="0.35"/>
          <path class="w2" d="M24 18 L34 15 L29.5 19 L36.5 20 L30 23 L34 28 L24 25 Z" fill="currentColor" opacity="0.35"/>
          <path d="M24 5.5 C17.5 5.5 13.5 10.5 13.5 16.5 C13.5 21.5 16.5 25.5 20.5 26.8 L20.5 29 L27.5 29 L27.5 26.8 C31.5 25.5 34.5 21.5 34.5 16.5 C34.5 10.5 30.5 5.5 24 5.5 Z" fill="currentColor"/>
          <circle cx="20.6" cy="17.5" r="1.7" fill="#1d211a"/>
          <circle cx="27.4" cy="17.5" r="1.7" fill="#1d211a"/>
          <path d="M22.3 21.5 Q24 23.2 25.7 21.5" stroke="#1d211a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
          <path d="M24 28.5 L19.5 32.5 L18.5 42.5 L22 39.8 L24 41.8 L26 39.8 L29.5 42.5 L28.5 32.5 Z" fill="currentColor"/>
          <path d="M18.8 27.2 Q24 30.2 29.2 27.2 L29.2 30.8 Q24 33.2 18.8 30.8 Z" fill="#a3352a"/>
          <path d="M28.5 29.5 L35 35.5 L30.5 36 Z" fill="#a3352a"/>
          <rect x="14.5" y="32" width="4" height="7" rx="1" fill="currentColor" opacity="0.85"/>
          <rect x="29.5" y="32" width="4" height="7" rx="1" fill="currentColor" opacity="0.85"/>
          <path d="M12.5 29 L18.5 34.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M35.5 29 L29.5 34.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div>
          <div class="date" id="today"></div>
          <span class="week" id="week"></span>
        </div>
      </div>
      <div class="progress" id="progress" role="group" aria-label="今日完成进度"></div>
    </header>

    <section class="block" id="overdueBlock" hidden>
      <h2>逾期 <span id="overdueCount"></span></h2>
      <ul id="overdueList"></ul>
    </section>

    <section class="block" id="todayBlock">
      <h2>今日清单</h2>
      <ul id="todayList"></ul>
      <div class="empty" id="emptyHint" hidden>今天还没有事项，在下面加一条。</div>
      <form class="add" id="addForm" autocomplete="off">
        <input class="add-input" id="addInput" type="text" placeholder="添加一项…" aria-label="添加事项">
        <button class="add-btn" type="submit" aria-label="添加">+</button>
      </form>
    </section>

    <details class="block fold" id="remBlock">
      <summary>
        <h2>提醒<span class="fold-count" id="remCount" hidden></span></h2>
      </summary>
      <div class="fold-body">
        <ul id="remindList"></ul>
        <div class="empty" id="remEmpty" hidden>还没有提醒，在下面加一条。</div>
        <div class="export-row">
          <button class="act" id="exportBtn" type="button">导出日历 .ics</button>
          <span class="export-tip" id="exportTip"></span>
        </div>
        <form class="rem-form" id="remForm" autocomplete="off">
          <div class="rem-row">
            <input class="add-input" id="remTitle" type="text" placeholder="提醒标题…" aria-label="提醒标题">
            <button class="add-btn" type="submit" aria-label="添加提醒">+</button>
          </div>
          <div class="rem-row">
            <input class="add-input" id="remAt" type="datetime-local" aria-label="事件时间">
            <input class="add-input lead-input" id="remLead" type="number" min="0" step="5" value="0" aria-label="提前分钟数">
            <span class="lead-tip">分钟前</span>
          </div>
        </form>
      </div>
    </details>

    <div class="mascot">
      <img src="assets/mascot.png" alt="同行的小兵">
      <div class="mascot-bubble">
        <span class="mascot-name">SCOUT</span>
        <span class="mascot-line" id="mascotLine"></span>
      </div>
    </div>

    <footer class="foot">
      <span id="tip">数据只存在这台设备的浏览器里</span>
      <button class="link" id="clearSeed" hidden>清空示例</button>
    </footer>
  </main>

  <script>
    // ---------- 存储层（F4）----------
    var KEY = 'habit-checkin:v1';

    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function todayStr() {
      var d = new Date();
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function load() {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var data = JSON.parse(raw);
        if (!data || !Array.isArray(data.items)) return null;
        return {
          items: data.items,
          reminders: Array.isArray(data.reminders) ? data.reminders : [],
          seeded: !!data.seeded
        };
      } catch (e) {
        return null;
      }
    }

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
      } catch (e) {
        document.getElementById('tip').textContent = '保存失败：浏览器存储不可用';
      }
    }

    // ---------- Mock 数据源 ----------
    // 第 3 周接真实 API 时，只替换 fetchState() 内部这一小块；UI 层一行都不用改
    var MOCK = {
      items: ['买咖啡豆', '复习第三章', '取快递'],
      reminders: [
        { title: '高铁去上海', hours: 5, lead: 90 },
        { title: '作业截止', hours: 9, lead: 0 }
      ]
    };

    function localInputValue(hoursFromNow) {
      var d = new Date(Date.now() + hoursFromNow * 3600000);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function mockState() {
      var t = todayStr();
      var now = new Date().toISOString();
      return {
        items: MOCK.items.map(function (title) {
          return { id: uid(), title: title, date: t, done: false, createdAt: now, doneAt: null };
        }),
        reminders: MOCK.reminders.map(function (r) {
          return { id: uid(), title: r.title, at: localInputValue(r.hours), lead: r.lead, done: false };
        }),
        seeded: true
      };
    }

    // 浏览器到底让不让写 localStorage（无痕模式 / 配额满 / 被策略禁用时会 false）
    function storageOk() {
      try {
        localStorage.setItem('__probe__', '1');
        localStorage.removeItem('__probe__');
        return true;
      } catch (e) {
        return false;
      }
    }

    // 取数据 —— 异步、且可能失败。
    // 这一层存在的意义：让「加载中」和「错误」两种状态在技术上成立。
    // 同步读 localStorage 的版本无处安放这两种状态，因为它不会慢、也不会报错。
    function fetchState() {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          try {
            if (FORCE_STATE === 'error') throw new Error('模拟：取数据失败');
            if (FORCE_STATE === 'loading') return;          // 一直停在加载态
            if (FORCE_STATE === 'mock') {                   // 强制假数据版（演示/截图），不落盘
              resolve(mockState());
              return;
            }
            if (FORCE_STATE === 'empty') {                  // 强制空数据版（演示空态），不落盘
              resolve({ items: [], reminders: [], seeded: false });
              return;
            }
            if (!storageOk()) throw new Error('浏览器不允许读写本地存储（可能开着无痕模式）');
            resolve(load() || mockState());
          } catch (e) {
            reject(e);
          }
        }, 600);   // 模拟一次网络往返；接真 API 后这里换成 fetch
      });
    }

    var FORCE_STATE = new URLSearchParams(location.search).get('state');
    var state = null;

    // ---------- 渲染 ----------
    var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

    function render() {
      var today = todayStr();
      var d = new Date();
      document.getElementById('today').textContent =
        (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
      document.getElementById('week').textContent =
        d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' · ' + WEEK[d.getDay()];

      var todays = state.items.filter(function (i) { return i.date === today; });
      var done = todays.filter(function (i) { return i.done; }).length;
      var progressEl = document.getElementById('progress');
      var allDone = todays.length > 0 && done === todays.length;
      progressEl.className = 'progress' + (allDone ? ' is-done' : '');
      progressEl.innerHTML =
        '<span class="pg">' +
          '<span class="pg-num">' + done +
            '<span class="pg-tot">/' + todays.length + '</span>' +
          '</span>' +
          '<span class="pg-label">完成</span>' +
        '</span>' +
        '<span class="pg-track"><i></i></span>';
      progressEl.style.setProperty('--pct',
        todays.length ? Math.round(done / todays.length * 100) + '%' : '0%');

      // 逾期 = 未完成 且 日期早于今天（YYYY-MM-DD 可直接字符串比较）
      var overdue = state.items
        .filter(function (i) { return !i.done && i.date < today; })
        .sort(function (a, b) { return a.date < b.date ? -1 : 1; });

      document.getElementById('mascotLine').textContent = mascotLine(todays.length, done, overdue.length);

      renderOverdue(overdue, today);
      renderToday(todays);
      renderReminders();
      document.getElementById('clearSeed').hidden = !state.seeded;
    }

    // ---------- 提醒（F2）----------
    // 提醒时刻 = 事件时刻 − 提前量（A4：14:00 提前 90 分 → 10:30 就该响）
    function remindViews() {
      var now = Date.now();
      return state.reminders.map(function (r) {
        var at = new Date(r.at).getTime();
        var remindAt = at - (r.lead || 0) * 60000;
        return {
          r: r,
          at: at,
          remindAt: remindAt,
          hi: !r.done && now >= remindAt && at >= now,   // 已到提醒时刻 且 事件还没过 → 高亮
          past: at < now                                  // 事件时间已过 → 标红（B2）
        };
      }).sort(function (a, b) {
        if (a.r.done !== b.r.done) return a.r.done ? 1 : -1;   // 完成的排末尾（F2.5）
        if (a.hi !== b.hi) return a.hi ? -1 : 1;               // 高亮置顶（F2.3）
        return a.remindAt - b.remindAt;                        // 其余按提醒时刻升序（F2.2）
      });
    }

    function fmtTime(dt) {
      var md = (dt.getMonth() + 1) + '/' + dt.getDate();
      return md + ' ' + pad(dt.getHours()) + ':' + pad(dt.getMinutes());
    }

    function renderReminders() {
      var ul = document.getElementById('remindList');
      var views = remindViews();
      ul.innerHTML = '';
      document.getElementById('remEmpty').hidden = views.length > 0;

      // 折叠状态下列表是看不见的，所以待办条数必须写在标题上
      var pending = views.filter(function (v) { return !v.r.done; }).length;
      var cnt = document.getElementById('remCount');
      cnt.textContent = pending ? String(pending) : '';
      cnt.hidden = pending === 0;

      views.forEach(function (v) {
        var r = v.r;
        var li = document.createElement('li');
        li.className = (r.done ? 'done ' : '') + (v.hi ? 'hi ' : '') + (v.past && !r.done ? 'past ' : '');

        var dot = document.createElement('button');
        dot.className = 'dot' + (r.done ? ' on' : '');
        dot.textContent = r.done ? '✓' : '';
        dot.setAttribute('aria-label', '标记提醒完成');

        var main = document.createElement('div');
        main.className = 'rm-main';

        var title = document.createElement('span');
        title.className = 'title';
        title.textContent = r.title;

        var meta = document.createElement('span');
        meta.className = 'rm-meta';
        if (r.done) {
          meta.textContent = '已完成 · ' + fmtTime(new Date(v.at));
        } else if (v.past) {
          meta.textContent = '已过期 · ' + fmtTime(new Date(v.at));
        } else if (v.hi) {
          meta.textContent = '现在！事件 ' + fmtTime(new Date(v.at)) +
            (r.lead ? '（已提前 ' + r.lead + ' 分钟）' : '');
        } else {
          meta.textContent = fmtTime(new Date(v.at)) + ' 的事件 · ' +
            (r.lead ? '提前 ' + r.lead + ' 分 → ' + fmtTime(new Date(v.remindAt)) + ' 提醒' : '到点提醒');
        }

        main.appendChild(title);
        main.appendChild(meta);

        var del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = '删除';
        del.setAttribute('aria-label', '删除');

        dot.addEventListener('click', function () { toggleReminder(r.id); });
        del.addEventListener('click', function () { removeReminder(r.id); });

        li.appendChild(dot);
        li.appendChild(main);
        li.appendChild(del);
        ul.appendChild(li);
      });

      // 导出按钮状态：可导出条数 + 那句必须写明的代价
      var n = exportable(views).length;
      document.getElementById('exportBtn').disabled = n === 0;
      document.getElementById('exportTip').textContent = n === 0
        ? '没有可导出的提醒（已完成、已过期的不进日历）'
        : '可导出 ' + n + ' 条 · 改了提醒要重新导出导入一次';

      // 到点的提醒不能藏在折叠里；但只自动开一次，否则用户手动收起后又被弹开
      if (!remAutoOpened && views.some(function (v) { return v.hi; })) {
        remAutoOpened = true;
        document.getElementById('remBlock').open = true;
      }

      // 供定时器比对：只有状态真变了才重绘（避免每半分钟闪一下）
      lastSig = views.map(function (v) {
        return v.r.id + (v.hi ? '!' : '') + (v.past ? '~' : '') + (v.r.done ? '#' : '');
      }).join(',');
    }

    var lastSig = '';
    var remAutoOpened = false;

    // 提醒区的折叠状态单独存一个 key —— 不进 state，也就不影响数据 schema 和 .ics 导出
    var REM_OPEN_KEY = 'habit.rem.open';
    function initRemFold() {
      var el = document.getElementById('remBlock');
      var saved = null;
      try { saved = localStorage.getItem(REM_OPEN_KEY); } catch (e) {}
      if (saved === '1') el.open = true;                 // 上次是展开的就保持展开
      el.addEventListener('toggle', function () {
        try { localStorage.setItem(REM_OPEN_KEY, el.open ? '1' : '0'); } catch (e) {}
      });
    }

    // ---------- 日历导出（F6）----------
    // 只导「未完成 且 事件时间还没到」—— 已过期/已完成的进了日历也不会响（F6.1 / F6.4）
    function exportable(views) {
      return views.filter(function (v) { return !v.r.done && !v.past; });
    }

    function icsEscape(s) {
      return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;')
        .replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    }

    // 本地浮动时间：20260923T140000（不带 Z，日历 App 按设备本地时区解释）
    function icsLocal(dt) {
      return dt.getFullYear() + pad(dt.getMonth() + 1) + pad(dt.getDate()) + 'T' +
        pad(dt.getHours()) + pad(dt.getMinutes()) + '00';
    }

    // DTSTAMP 必须是 UTC（RFC 5545）
    function icsUtc(dt) {
      return dt.getUTCFullYear() + pad(dt.getUTCMonth() + 1) + pad(dt.getUTCDate()) + 'T' +
        pad(dt.getUTCHours()) + pad(dt.getUTCMinutes()) + pad(dt.getUTCSeconds()) + 'Z';
    }

    function buildIcs(list) {
      var lines = [
        'BEGIN:VCALENDAR', 'VERSION:2.0',
        'PRODID:-//habit-checkin//ZH//CN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'
      ];
      var stamp = icsUtc(new Date());

      list.forEach(function (v) {
        var r = v.r;
        var dt = new Date(v.at);
        lines.push('BEGIN:VEVENT');
        lines.push('UID:' + r.id + '@habit-checkin');       // 稳定 UID：重复导入=更新（B5）
        lines.push('DTSTAMP:' + stamp);
        lines.push('DTSTART:' + icsLocal(dt));
        lines.push('DTEND:' + icsLocal(new Date(v.at + 30 * 60000)));
        lines.push('SUMMARY:' + icsEscape(r.title));
        lines.push('DESCRIPTION:' + icsEscape('来自每日打卡清单（提前 ' + (r.lead || 0) + ' 分钟）'));
        lines.push('BEGIN:VALARM');
        lines.push('ACTION:DISPLAY');
        lines.push('TRIGGER:-PT' + (r.lead || 0) + 'M');     // 提前量 → 系统日历的闹钟（F6.2）
        lines.push('DESCRIPTION:' + icsEscape(r.title));
        lines.push('END:VALARM');
        lines.push('END:VEVENT');
      });

      lines.push('END:VCALENDAR');
      return lines.join('\r\n');
    }

    document.getElementById('exportBtn').addEventListener('click', function () {
      var list = exportable(remindViews());
      if (list.length === 0) return;
      var blob = new Blob([buildIcs(list)], { type: 'text/calendar;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'habit-checkin-reminders.ics';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    });

    function toggleReminder(id) {
      state.reminders.forEach(function (r) {
        if (r.id === id) r.done = !r.done;
      });
      save();
      render();
    }

    function removeReminder(id) {
      state.reminders = state.reminders.filter(function (r) { return r.id !== id; });
      save();
      render();
    }

    function daysAgo(dateStr, today) {
      var a = new Date(dateStr + 'T00:00:00');
      var b = new Date(today + 'T00:00:00');
      return Math.round((b - a) / 86400000);
    }

    function renderOverdue(list, today) {
      var block = document.getElementById('overdueBlock');
      var ul = document.getElementById('overdueList');
      block.hidden = list.length === 0;
      if (list.length === 0) { ul.innerHTML = ''; return; }

      document.getElementById('overdueCount').textContent = '(' + list.length + ')';
      ul.innerHTML = '';

      list.forEach(function (item) {
        var li = document.createElement('li');
        li.className = 'od';

        var main = document.createElement('div');
        main.className = 'od-main';

        var title = document.createElement('span');
        title.className = 'title';
        title.textContent = item.title;

        var meta = document.createElement('span');
        meta.className = 'od-date';
        var n = daysAgo(item.date, today);
        meta.textContent = item.date.slice(5).replace('-', ' 月 ') + ' 日 · 已过 ' + n + ' 天';

        main.appendChild(title);
        main.appendChild(meta);

        var move = document.createElement('button');
        move.className = 'act';
        move.textContent = '挪到今天';
        move.addEventListener('click', function () { moveToToday(item.id); });

        var del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = '删除';
        del.setAttribute('aria-label', '删除');
        del.addEventListener('click', function () { removeItem(item.id); });

        li.appendChild(main);
        li.appendChild(move);
        li.appendChild(del);
        ul.appendChild(li);
      });
    }

    function moveToToday(id) {
      var t = todayStr();
      state.items.forEach(function (i) {
        if (i.id === id) i.date = t;
      });
      save();
      render();
    }

    function mascotLine(total, done, overdue) {
      if (overdue > 0) return '有 ' + overdue + ' 项昨天没做完，先处理它们。';
      if (total === 0) return '今天还没有事项，先加一条吧。';
      if (done === 0) return '今天从哪一件开始？';
      if (done === total) return '今日全清，敬礼！';
      if (done / total >= 0.5) return '过半了，剩下的不多。';
      return '开始了就好，继续。';
    }

    function renderToday(list) {
      var ul = document.getElementById('todayList');
      ul.innerHTML = '';
      document.getElementById('emptyHint').hidden = list.length > 0;

      list.forEach(function (item) {
        var li = document.createElement('li');
        if (item.done) li.className = 'done';

        var dot = document.createElement('button');
        dot.className = 'dot' + (item.done ? ' on' : '');
        dot.textContent = item.done ? '✓' : '';
        dot.setAttribute('aria-label', '切换完成状态');

        var title = document.createElement('span');
        title.className = 'title';
        title.textContent = item.title;

        var del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = '删除';
        del.setAttribute('aria-label', '删除');

        dot.addEventListener('click', function () { toggleItem(item.id); });
        del.addEventListener('click', function () { removeItem(item.id); });

        li.appendChild(dot);
        li.appendChild(title);
        li.appendChild(del);
        ul.appendChild(li);
      });
    }

    function toggleItem(id) {
      state.items.forEach(function (i) {
        if (i.id === id) {
          i.done = !i.done;
          i.doneAt = i.done ? new Date().toISOString() : null;
        }
      });
      save();
      render();
    }

    function removeItem(id) {
      state.items = state.items.filter(function (i) { return i.id !== id; });
      save();
      render();
    }

    function addItem(title) {
      state.items.push({
        id: uid(),
        title: title,
        date: todayStr(),
        done: false,
        createdAt: new Date().toISOString(),
        doneAt: null
      });
      save();
      render();
    }

    var addInput = document.getElementById('addInput');
    document.getElementById('addForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = addInput.value.trim();
      if (!title) return;
      addItem(title);
      addInput.value = '';
      addInput.focus();
    });

    var remTitle = document.getElementById('remTitle');
    var remAt = document.getElementById('remAt');
    var remLead = document.getElementById('remLead');
    document.getElementById('remForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = remTitle.value.trim();
      if (!title) return;                                   // 空标题：无反应（B1 同款）
      if (!remAt.value) { remAt.focus(); return; }           // 时间必填
      var lead = parseInt(remLead.value, 10);
      if (isNaN(lead) || lead < 0) lead = 0;

      state.reminders.push({
        id: uid(),
        title: title,
        at: remAt.value,        // "YYYY-MM-DDTHH:mm" 本地时间
        lead: lead,
        done: false
      });
      save();
      render();
      remTitle.value = '';
      remLead.value = '0';
      remTitle.focus();
    });

    // 到点自动高亮：每 30 秒比对一次状态，只有真变了才重绘（F2.3「不用刷新也能变」）
    setInterval(function () {
      if (!state) return;                                   // 数据还没到（或加载失败），跳过
      var sig = remindViews().map(function (v) {
        return v.r.id + (v.hi ? '!' : '') + (v.past ? '~' : '') + (v.r.done ? '#' : '');
      }).join(',');
      if (sig !== lastSig) render();
    }, 30000);

    document.getElementById('clearSeed').addEventListener('click', function () {
      state.items = [];
      state.seeded = false;
      save();
      render();
    });

    // ---------- 启动 ----------
    // 四态里的「错误」在开发时几乎不会自然出现，所以必须能被强制触发才好验证
    function showError(err) {
      document.body.classList.add('is-error');
      document.getElementById('errorMsg').textContent =
        err.message + '。可以点重试；如果浏览器不让存数据，换普通窗口（别用无痕）再打开。';
    }

    function boot() {
      document.body.classList.remove('is-error');
      document.body.classList.add('is-loading');
      fetchState().then(function (data) {
        state = data;
        var isDemo = FORCE_STATE === 'mock' || FORCE_STATE === 'empty';
        if (!isDemo) save();                              // 演示态不写回，绝不碰真实存储
        document.body.classList.remove('is-loading');
        render();
      }).catch(function (err) {
        document.body.classList.remove('is-loading');
        showError(err);
      });
    }

    document.getElementById('retryBtn').addEventListener('click', function () {
      // 先把强制失败开关摘掉，否则点了重试还是失败，看着像坏了
      if (FORCE_STATE === 'error') {
        FORCE_STATE = null;
        history.replaceState(null, '', location.pathname);
      }
      boot();
    });

    initRemFold();
    boot();
  </script>
</body>
</html>
