<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日打卡清单 · Day 2 占位页</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #2c2c2a;
      --muted: #5f5e5a;
      --line: #d3d1c7;
      --accent: #185fa5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 500;
    }
    .day {
      display: inline-block;
      font-size: 12px;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 2px 10px;
      margin-bottom: 16px;
    }
    p {
      margin: 0 0 12px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
    }
    ul {
      margin: 0;
      padding-left: 20px;
      font-size: 14px;
      line-height: 1.9;
      color: var(--muted);
    }
    .foot {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="day">Day 2 · 第 1 周</span>
    <h1>每日打卡清单</h1>
    <p>这里是项目仓库的占位页。功能还没开始写，先把家安好。</p>
    <ul>
      <li>习惯打卡</li>
      <li>任务截止时间提醒</li>
    </ul>
    <div class="foot">网站功能开发排在 Day 7，今天只完成仓库与首次提交。</div>
  </div>
</body>
</html>
